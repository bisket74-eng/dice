<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>Dice Roller</title>
<style>
:root{
  --bg:#080a0f;--bg2:#171b27;--panel:#121722ee;--text:#fff;--muted:#aeb7c7;
  --die:#f7f5ed;--die2:#fff;--pip:#11151d;--edge:#fff;--accent:#ffb82e;
  --accent2:#ffe083;--accentText:#161006;--glow:#ffbe3c55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:var(--bg)}
body:fullscreen,body:-webkit-full-screen{width:100vw;height:100dvh;overflow:hidden}
body{
 color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:radial-gradient(circle at 50% 5%,var(--bg2),var(--bg) 78%);
}
.app{
 width:100%;height:100dvh;max-width:1100px;margin:auto;
 padding:max(5px,env(safe-area-inset-top)) 10px max(5px,env(safe-area-inset-bottom));
 display:grid;grid-template-rows:auto 1fr auto;gap:5px;overflow:hidden;
}
header{
 z-index:20;text-align:center;max-height:240px;overflow:hidden;
 transition:transform .62s cubic-bezier(.18,.8,.18,1),opacity .38s ease,max-height .62s ease;
}
h1{margin:0 0 5px;font-size:clamp(1.2rem,4vw,2.1rem);line-height:1;letter-spacing:-.04em}
.top-controls,.dice-controls,.auto-controls{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap}
.small-button{
 border:1px solid #ffffff2e;background:#ffffff12;color:#fff;border-radius:9px;
 padding:6px 10px;font-size:.76rem;font-weight:850;cursor:pointer;touch-action:manipulation
}
.small-button:active{transform:scale(.96)}
.small-button.active{background:#ffffff30;border-color:#ffffff66}
.dice-controls{margin-top:4px}
.die-control{
 display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--panel);
 border:1px solid #ffffff1a;border-radius:8px
}
.die-control span,.auto-label{color:var(--muted);font-size:.65rem;font-weight:850}
select{
 appearance:none;color:#fff;background:#0007;border:1px solid #ffffff38;border-radius:6px;
 padding:4px 18px 4px 6px;font-size:.74rem;font-weight:850
}
.auto-controls{margin-top:4px}

.stage{
 position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
 perspective:1400px;perspective-origin:50% 48%;
}
.dice{
 position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
 gap:clamp(20px,5vw,48px);overflow:visible;
}

/* Three dice maximum per row. Four or more continue onto additional rows. */
.dice.count-4,.dice.count-5,.dice.count-6,
.dice.count-7,.dice.count-8,.dice.count-9,.dice.count-10{
 display:grid;
 grid-template-columns:repeat(3,max-content);
 grid-auto-rows:max-content;
 align-content:center;
 justify-content:center;
 gap:clamp(12px,2.5vw,28px) clamp(12px,3vw,34px);
}
.die-wrap{
 position:relative;width:var(--size);height:var(--size);flex:0 0 var(--size);
 display:grid;place-items:center;transform-style:preserve-3d;
}
.die-canvas{
 width:100%;height:100%;display:block;overflow:visible;
 filter:drop-shadow(0 14px 18px #0007);
}
.die-wrap.d6{
 --depth:calc(var(--size)/2);
}
.die-cube{
 width:100%;height:100%;position:relative;transform-style:preserve-3d;
 transform-origin:center center;
}
.face{
 position:absolute;inset:0;width:100%;height:100%;border-radius:clamp(12px,3vw,28px);
 background:linear-gradient(145deg,var(--die2),var(--die));
 border:2px solid var(--edge);
 box-shadow:inset 0 -8px 0 #00000016,inset 0 2px 5px #ffffff42;
 backface-visibility:hidden;display:grid;place-items:center;
}
.face.front{transform:translateZ(var(--depth))}
.face.back{transform:rotateY(180deg) translateZ(var(--depth))}
.face.right{transform:rotateY(90deg) translateZ(var(--depth))}
.face.left{transform:rotateY(-90deg) translateZ(var(--depth))}
.face.top{transform:rotateX(90deg) translateZ(var(--depth))}
.face.bottom{transform:rotateX(-90deg) translateZ(var(--depth))}
.pips{
 width:88%;height:88%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)
}
.pip{
 width:88%;aspect-ratio:1;border-radius:50%;background:var(--pip);place-self:center;
 box-shadow:inset 0 2px 3px #ffffff20,0 3px 5px #0004
}
.die-label{
 position:absolute;right:7px;bottom:5px;color:var(--pip);opacity:.35;
 font-size:.55rem;font-weight:900
}

.dice.count-1 .die-wrap{--size:min(68vw,66vh,470px)}
.dice.count-2 .die-wrap{--size:min(39vw,43vh,300px)}
.dice.count-3 .die-wrap{--size:min(28vw,34vh,220px)}
.dice.count-4 .die-wrap,.dice.count-5 .die-wrap,.dice.count-6 .die-wrap{--size:min(27vw,27vh,210px)}
.dice.count-7 .die-wrap,.dice.count-8 .die-wrap,.dice.count-9 .die-wrap{--size:min(27vw,18vh,165px)}
.dice.count-10 .die-wrap{--size:min(27vw,15vh,145px)}

.roll .die-cube{animation:cubeTumble 1.65s cubic-bezier(.12,.78,.18,1) both}
.roll .die-canvas{animation:canvasTumble 1.65s cubic-bezier(.12,.78,.18,1) both}
@keyframes cubeTumble{
 0%{transform:rotateX(0) rotateY(0) rotateZ(0)}
 13%{transform:rotateX(150deg) rotateY(125deg) rotateZ(85deg)}
 29%{transform:rotateX(330deg) rotateY(285deg) rotateZ(205deg)}
 47%{transform:rotateX(555deg) rotateY(470deg) rotateZ(325deg)}
 64%{transform:rotateX(760deg) rotateY(650deg) rotateZ(455deg)}
 81%{transform:rotateX(930deg) rotateY(815deg) rotateZ(575deg)}
 93%{transform:rotateX(1020deg) rotateY(900deg) rotateZ(635deg)}
 100%{transform:rotateX(1080deg) rotateY(990deg) rotateZ(690deg)}
}
@keyframes canvasTumble{
 0%{transform:rotate(-3deg) scale(.76)}
 15%{transform:rotate(38deg) scale(1.03)}
 30%{transform:rotate(-44deg) scale(.94)}
 48%{transform:rotate(62deg) scale(1.04)}
 66%{transform:rotate(-35deg) scale(.96)}
 82%{transform:rotate(24deg) scale(1.02)}
 94%{transform:rotate(-8deg) scale(1.01)}
 100%{transform:rotate(0) scale(1)}
}
.settle{animation:settle .25s ease-out}
@keyframes settle{
 0%{transform:translateY(0) scale(1)}
 40%{transform:translateY(-9px) scale(1.015)}
 100%{transform:translateY(0) scale(1)}
}

.pass-message{
 position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
 text-align:center;opacity:0;transform:scale(.7);pointer-events:none;
 transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.2,1)
}
.pass-message.visible{opacity:1;transform:scale(1)}
.pass-inner{
 padding:clamp(20px,5vw,55px) clamp(25px,7vw,75px);border-radius:28px;
 background:#000d;border:3px solid #ffffffb3;
 box-shadow:0 20px 70px #000b,0 0 50px var(--glow);backdrop-filter:blur(10px);
 font-size:clamp(2.2rem,10vw,6rem);line-height:.95;font-weight:1000;letter-spacing:-.045em
}
.bottom{display:flex;justify-content:center;align-items:center;padding:2px 0;z-index:30}
#mainButton{
 width:min(100%,570px);min-height:clamp(56px,9vh,80px);border:0;border-radius:17px;
 background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accentText);
 font-size:clamp(1.25rem,5vw,2rem);font-weight:950;cursor:pointer;touch-action:manipulation;
 box-shadow:0 10px 26px #0006,0 7px 20px #ffb52e33
}
#mainButton:active{transform:scale(.975) translateY(2px)}
.app.controls-hidden{grid-template-rows:0 1fr auto}
.controls-hidden header{
 transform:translateY(calc(-100% - 30px));opacity:0;max-height:0;pointer-events:none
}
.controls-hidden .reveal-tab{top:0}
.reveal-tab{
 position:fixed;top:-2px;left:50%;transform:translateX(-50%) translateY(-115%);
 z-index:100;border:0;border-radius:0 0 12px 12px;padding:10px 22px 12px;min-width:150px;
 background:#000b;color:#fff;font-size:.7rem;font-weight:900;letter-spacing:.03em;
 opacity:0;pointer-events:none;transition:transform .35s ease,opacity .25s ease;backdrop-filter:blur(8px)
}
.controls-hidden .reveal-tab{transform:translateX(-50%) translateY(0);opacity:.7;pointer-events:auto}
.controls-hidden .reveal-tab:active{transform:translateX(-50%) translateY(2px)}
.auto-mode #mainButton{background:linear-gradient(180deg,#ff7878,#e53b3b);color:#fff}
@media(max-width:650px) and (orientation:portrait){
 .dice.count-2{flex-direction:column;gap:clamp(10px,2.5vh,20px)}
 .dice.count-2 .die-wrap{--size:min(57vw,29vh,250px)}

 /* On phones, 4+ dice still use rows of three. */
 .dice.count-4,.dice.count-5,.dice.count-6,
 .dice.count-7,.dice.count-8,.dice.count-9,.dice.count-10{
  grid-template-columns:repeat(3,max-content);
  gap:clamp(8px,2vw,16px);
 }
 .dice.count-4 .die-wrap,.dice.count-5 .die-wrap,.dice.count-6 .die-wrap{
  --size:min(28vw,25vh,180px);
 }
 .dice.count-7 .die-wrap,.dice.count-8 .die-wrap,.dice.count-9 .die-wrap{
  --size:min(28vw,17vh,135px);
 }
 .dice.count-10 .die-wrap{--size:min(28vw,13vh,115px)}
}
@media(orientation:landscape) and (max-height:520px){
 .app{padding-top:3px;gap:3px}
 h1{font-size:1.1rem}.small-button{padding:4px 7px;font-size:.68rem}
 #mainButton{min-height:44px;font-size:1.05rem}
 .dice.count-1 .die-wrap{--size:min(38vh,34vw,255px)}
 .dice.count-2 .die-wrap{--size:min(32vh,34vw,230px)}
}
</style>
</head>
<body>
<main class="app" id="app">
<button class="reveal-tab" id="revealTab" aria-label="Show controls">⌄ SHOW CONTROLS</button>
<header id="controls">
<h1>🎲 Dice Roller</h1>
<div class="top-controls">
<button class="small-button" id="addDie">＋ Add Die</button>
<button class="small-button" id="removeDie">− Remove Die</button>
<button class="small-button" id="skinButton">🎨 Random Skin</button>
<button class="small-button" id="voiceButton" aria-pressed="false">🔇 Voice Off</button>
</div>
<div class="dice-controls" id="diceControls"></div>
<div class="auto-controls">
<span class="auto-label">AUTO</span>
<select id="intervalSelect">
<option value="2">2 sec</option><option value="3">3 sec</option>
<option value="4" selected>4 sec</option><option value="5">5 sec</option><option value="10">10 sec</option>
</select>
<button class="small-button" id="autoButton">▶ Auto Roll</button>
</div>
</header>

<section class="stage" id="stage">
<div class="dice" id="dice"></div>
<div class="pass-message" id="passMessage"><div class="pass-inner">PASS THE BALL</div></div>
</section>
<div class="bottom"><button id="mainButton">ROLL 🎲</button></div>
</main>

<script>
const app=document.getElementById("app");
const dice=document.getElementById("dice");
const diceControls=document.getElementById("diceControls");
const mainButton=document.getElementById("mainButton");
const addDie=document.getElementById("addDie");
const removeDie=document.getElementById("removeDie");
const skinButton=document.getElementById("skinButton");
const voiceButton=document.getElementById("voiceButton");
const autoButton=document.getElementById("autoButton");
const intervalSelect=document.getElementById("intervalSelect");
const passMessage=document.getElementById("passMessage");
const revealTab=document.getElementById("revealTab");

const SIDE_OPTIONS=[2,4,6,8,10,12,20,100];
const PIPS={
 1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]
};

let settings=[6,6],values=[1,1];
let auto=false,paused=false,rolling=false,voiceEnabled=false;
let timer=null,passTimer=null,audioCtx=null;

const rnd=n=>Math.floor(Math.random()*n)+1;

function renderControls(){
 diceControls.innerHTML="";
 settings.forEach((s,i)=>{
  const box=document.createElement("div");box.className="die-control";
  const label=document.createElement("span");label.textContent=`D${i+1}`;
  const select=document.createElement("select");
  SIDE_OPTIONS.forEach(v=>{
   const option=document.createElement("option");
   option.value=v;option.textContent=`D${v}`;option.selected=v===s;select.appendChild(option);
  });
  select.onchange=()=>{settings[i]=Number(select.value);values[i]=Math.min(values[i]||1,settings[i])||1;renderDice()};
  box.append(label,select);diceControls.appendChild(box);
 });
}

function pipFace(value){
 const face=document.createElement("div");face.className="face";
 const grid=document.createElement("div");grid.className="pips";
 for(let i=0;i<9;i++){
  const pip=document.createElement("span");pip.className="pip";
  pip.style.visibility=PIPS[value]?.includes(i)?"visible":"hidden";
  grid.appendChild(pip);
 }
 face.appendChild(grid);return face;
}

const D6_ORIENT={
 1:"rotateX(0deg) rotateY(0deg) rotateZ(0deg)",
 2:"rotateX(0deg) rotateY(90deg) rotateZ(0deg)",
 3:"rotateX(-90deg) rotateY(0deg) rotateZ(0deg)",
 4:"rotateX(90deg) rotateY(0deg) rotateZ(0deg)",
 5:"rotateX(0deg) rotateY(-90deg) rotateZ(0deg)",
 6:"rotateX(0deg) rotateY(180deg) rotateZ(0deg)"
};

function makeD6(value){
 const wrap=document.createElement("div");wrap.className="die-wrap d6";
 const cube=document.createElement("div");cube.className="die-cube";
 const sideRight={1:3,2:4,3:1,4:2,5:6,6:5};
 const sideTop={1:5,2:6,3:5,4:6,5:1,6:2};
 const rv=sideRight[value],tv=sideTop[value];
 const vals={front:value,back:7-value,right:rv,left:7-rv,top:tv,bottom:7-tv};
 Object.entries(vals).forEach(([side,v])=>{
  const f=pipFace(v);f.classList.add(side);cube.appendChild(f);
 });
 cube.dataset.final=value;wrap.appendChild(cube);return wrap;
}

/*
  NON-D6 DICE:
  These are real multi-face drawings, not a single flat "front" polygon.
  Canvas is used so every die can show several visible numbered faces at once,
  and the entire faceted body tumbles during a roll.
*/
function makePolyDie(sides,value){
 const wrap=document.createElement("div");
 wrap.className="die-wrap poly";
 const canvas=document.createElement("canvas");
 canvas.className="die-canvas";
 canvas.width=700;canvas.height=700;
 canvas.dataset.sides=sides;
 canvas.dataset.value=value;
 wrap.appendChild(canvas);
 drawPolyDie(canvas,sides,value,0);
 return wrap;
}

function roundedPolygon(ctx,cx,cy,r,n,rot=.0){
 const pts=[];
 for(let i=0;i<n;i++){
  const a=rot+(Math.PI*2*i/n)-Math.PI/2;
  pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);
 }
 ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
 for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
 ctx.closePath();return pts;
}

function faceFill(ctx,pts,shade){
 const g=ctx.createLinearGradient(0,0,700,700);
 const base=getComputedStyle(document.documentElement).getPropertyValue("--die").trim()||"#f7f5ed";
 const hsl=base.match(/hsl\\(([^)]+)\\)/);
 if(hsl){
  const p=hsl[1].split(",").map(x=>x.trim());
  let l=parseFloat(p[2])||88;
  l=Math.max(12,Math.min(96,l+shade));
  g.addColorStop(0,`hsl(${p[0]},${p[1]},${l+5}%)`);
  g.addColorStop(1,`hsl(${p[0]},${p[1]},${l-7}%)`);
 }else{
  g.addColorStop(0,base);g.addColorStop(1,base);
 }
 ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--edge").trim()||"#fff";
 ctx.lineWidth=8;ctx.stroke();
}

function textColor(){
 return getComputedStyle(document.documentElement).getPropertyValue("--pip").trim()||"#11151d";
}

function drawNumber(ctx,text,x,y,size){
 ctx.save();ctx.fillStyle=textColor();ctx.font=`900 ${size}px system-ui,sans-serif`;
 ctx.textAlign="center";ctx.textBaseline="middle";ctx.shadowColor="#ffffff55";ctx.shadowBlur=3;
 ctx.fillText(String(text),x,y);ctx.restore();
}

function drawPolyDie(canvas,sides,value,phase){
 const ctx=canvas.getContext("2d");
 const W=canvas.width,H=canvas.height;
 ctx.clearRect(0,0,W,H);

 const cx=W/2,cy=H/2;
 const r=260;
 const n = sides===4?3 : sides===8?8 : sides===10?10 : sides===12?12 : sides===20?10 : sides===100?12:6;
 const rot=phase;
 const outer=roundedPolygon(ctx,cx,cy,r,n,rot);

 /* Drop shadow */
 ctx.save();ctx.translate(0,28);ctx.globalAlpha=.3;ctx.fillStyle="#000";
 ctx.filter="blur(18px)";ctx.beginPath();
 ctx.moveTo(outer[0][0],outer[0][1]);outer.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.restore();

 /*
   Build a visibly 3-D faceted solid:
   - a large center/top face
   - a ring of side faces converging toward a lower/offset point
   This gives D8/D10/D12/D20/D100 a genuine multi-face silhouette rather
   than the previous flat one-sided polygon.
 */
 if(sides===4){
  const top=[cx,cy-r*.72],left=[cx-r*.88,cy+r*.42],right=[cx+r*.88,cy+r*.42],bottom=[cx,cy+r*.9];
  const faces=[
   {p:[top,left,bottom],s:-10,v:Math.max(1,(value%4)+1)},
   {p:[top,right,bottom],s:-2,v:Math.max(1,((value+1)%4)+1)},
   {p:[top,left,right],s:10,v:Math.max(1,((value+2)%4)+1)}
  ];
  faces.forEach((f,i)=>{ctx.beginPath();ctx.moveTo(...f.p[0]);f.p.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();faceFill(ctx,f.p,f.s);drawNumber(ctx,i===0?value:f.v,cx+(i-1)*115,cy+15,74)});
  return;
 }

 const center={x:cx,y:cy-r*.10};
 const apex={x:cx,y:cy+r*.82};
 const pts=outer;
 for(let i=0;i<n;i++){
  const a=pts[i],b=pts[(i+1)%n];
  ctx.beginPath();ctx.moveTo(center.x,center.y);ctx.lineTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.closePath();
  faceFill(ctx,[center,a,b],-16+i*2);
  const mx=(center.x+a[0]+b[0])/3,my=(center.y+a[1]+b[1])/3;
  const faceNum=((value-1+i)%sides)+1;
  drawNumber(ctx,faceNum,mx,my,Math.max(30,Math.min(58,520/n)));
 }

 /* Front central face, raised above the ring. */
 ctx.beginPath();
 const front=[];
 const start=-Math.PI/2-.72;
 const count=sides===8?4:sides===12?5:sides===20?5:5;
 for(let i=0;i<count;i++){
  const a=start+i*(1.44/(count-1));
  front.push([cx+Math.cos(a)*145,cy+Math.sin(a)*145]);
 }
 ctx.moveTo(front[0][0],front[0][1]);front.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));
 ctx.closePath();faceFill(ctx,front,12);
 drawNumber(ctx,value,cx,cy,Math.max(62,Math.min(105,700/Math.sqrt(sides))));

 /* Little facet highlights make the body read as a die instead of a flat sign. */
 ctx.save();ctx.globalAlpha=.18;ctx.fillStyle="#fff";
 ctx.beginPath();ctx.arc(cx-r*.22,cy-r*.22,r*.24,0,Math.PI*2);ctx.fill();ctx.restore();

 ctx.save();ctx.fillStyle=textColor();ctx.globalAlpha=.4;ctx.font="800 24px system-ui";
 ctx.textAlign="right";ctx.textBaseline="bottom";ctx.fillText(`D${sides}`,W-28,H-24);ctx.restore();
}

function renderDice(){
 dice.innerHTML="";dice.className=`dice count-${settings.length}`;
 settings.forEach((s,i)=>{
  const v=Math.min(values[i]||1,s);values[i]=v;
  dice.appendChild(s===6?makeD6(v):makePolyDie(s,v));
 });
}

function getAudio(){
 if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx;
}
function clack(){
 try{
  const c=getAudio(),o=c.createOscillator(),g=c.createGain();
  o.type="square";o.frequency.setValueAtTime(125,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(58,c.currentTime+.055);
  g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.10,c.currentTime+.006);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.075);
  o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.08);
 }catch(e){}
}
function rollNoise(){
 try{
  const c=getAudio(),b=c.createBuffer(1,c.sampleRate*.22,c.sampleRate),data=b.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2.6);
  const src=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain();
  filter.type="bandpass";filter.frequency.value=1350;filter.Q.value=.7;gain.gain.value=.10;
  src.buffer=b;src.connect(filter).connect(gain).connect(c.destination);src.start();
 }catch(e){}
}
async function enterImmersive(){
 try{
  if(document.fullscreenElement)return;
  const target=document.documentElement;
  if(target.requestFullscreen)await target.requestFullscreen({navigationUI:"hide"});
  else if(target.webkitRequestFullscreen)target.webkitRequestFullscreen();
 }catch(e){}
}
async function exitImmersive(){
 try{
  if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();
  else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();
 }catch(e){}
}
function hideControls(){app.classList.add("controls-hidden");enterImmersive()}
function showControls(force=false){if(auto&&!force)return;app.classList.remove("controls-hidden");exitImmersive()}

function startRollAnimation(){
 [...dice.children].forEach((wrap,i)=>{
  wrap.classList.remove("roll","settle");
  const cube=wrap.querySelector(".die-cube");
  if(cube){cube.style.animation="none";cube.style.transform="";void cube.offsetWidth;cube.style.animation=""; }
  const canvas=wrap.querySelector(".die-canvas");
  if(canvas){canvas.style.animation="none";void canvas.offsetWidth;canvas.style.animation="";}
  wrap.classList.add("roll");
 });
 rollNoise();[320,690,1040,1400].forEach(t=>setTimeout(clack,t));
}

function finishRoll(result){
 [...dice.children].forEach((wrap,i)=>{
  const sides=settings[i],value=result[i];
  if(sides===6){
   const cube=wrap.querySelector(".die-cube");
   if(cube){cube.style.animation="none";cube.style.transform=D6_ORIENT[value]}
  }else{
   const canvas=wrap.querySelector(".die-canvas");
   if(canvas){canvas.style.animation="none";canvas.style.transform="";drawPolyDie(canvas,sides,value,0)}
  }
  wrap.classList.remove("roll");wrap.classList.add("settle");
  values[i]=value;setTimeout(()=>wrap.classList.remove("settle"),280);
 });
 clack();
}

async function roll(){
 if(rolling||paused||passMessage.classList.contains("visible"))return;
 rolling=true;hideControls();
 const result=settings.map(s=>Math.max(1,Math.min(s,Math.floor(Math.random()*s)+1)));
 const frozen=result.slice();
 startRollAnimation();
 await new Promise(resolve=>setTimeout(resolve,1720));
 finishRoll(frozen);rolling=false;

 const doubles=auto&&settings.length===2&&frozen[0]===frozen[1];
 if(doubles)showPass();
 else if(auto)schedule();
 else setTimeout(showControls,520);
}

function sayPassTheBall(){
 if(!voiceEnabled||!("speechSynthesis"in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance("Pass the ball");u.rate=.9;u.pitch=1;u.volume=1;speechSynthesis.speak(u);
}
function showPass(){
 clearTimeout(timer);clearTimeout(passTimer);passMessage.classList.add("visible");sayPassTheBall();
 const passDuration=Number(intervalSelect.value)*1000+1000;
 passTimer=setTimeout(()=>{passMessage.classList.remove("visible");if(auto&&!paused)roll()},passDuration);
}
function schedule(){
 clearTimeout(timer);
 if(auto&&!paused&&!rolling&&!passMessage.classList.contains("visible"))
  timer=setTimeout(()=>{if(auto&&!paused)roll()},Number(intervalSelect.value)*1000);
}
function startAuto(){
 auto=true;paused=false;app.classList.add("auto-mode");autoButton.textContent="⏹ Stop Auto";
 autoButton.classList.add("active");mainButton.textContent="⏸ PAUSE";hideControls();roll();
}
function stopAuto(){
 auto=false;paused=false;clearTimeout(timer);clearTimeout(passTimer);passMessage.classList.remove("visible");
 app.classList.remove("auto-mode");autoButton.textContent="▶ Auto Roll";autoButton.classList.remove("active");
 mainButton.textContent="ROLL 🎲";app.classList.remove("controls-hidden");exitImmersive();
}
function togglePause(){
 if(!auto||rolling)return;
 if(paused){paused=false;mainButton.textContent="⏸ PAUSE";hideControls();roll()}
 else{paused=true;clearTimeout(timer);clearTimeout(passTimer);passMessage.classList.remove("visible");mainButton.textContent="▶ ROLL AGAIN";showControls(true)}
}

mainButton.onclick=()=>auto?togglePause():roll();
autoButton.onclick=()=>auto?stopAuto():startAuto();
revealTab.onclick=()=>{showControls(true);if(paused)mainButton.textContent="▶ ROLL AGAIN"};
intervalSelect.onchange=()=>{if(auto&&!paused&&!rolling&&!passMessage.classList.contains("visible"))schedule()};

addDie.onclick=()=>{if(settings.length>=10)return;settings.push(6);values.push(1);renderControls();renderDice()};
removeDie.onclick=()=>{if(settings.length<=1)return;settings.pop();values.pop();renderControls();renderDice()};

function randomSkin(){
 const hue=Math.random()*360,dark=Math.random()<.72,light=dark?8+Math.random()*18:70+Math.random()*20;
 const die=`hsl(${hue},${dark?55:65}%,${light}%)`,die2=`hsl(${(hue+24)%360},${dark?60:70}%,${Math.min(97,light+10)}%)`;
 const pip=dark?`hsl(${(hue+155)%360},90%,94%)`:`hsl(${(hue+165)%360},60%,9%)`;
 const edge=`hsl(${(hue+35)%360},85%,${dark?65:35}%)`,accent=`hsl(${(hue+38)%360},85%,${dark?52:58}%)`;
 const accent2=`hsl(${(hue+38)%360},90%,${dark?68:78}%)`;
 const root=document.documentElement;
 root.style.setProperty("--die",die);root.style.setProperty("--die2",die2);root.style.setProperty("--pip",pip);
 root.style.setProperty("--edge",edge);root.style.setProperty("--accent",accent);root.style.setProperty("--accent2",accent2);
 root.style.setProperty("--bg2",`hsl(${hue},30%,${dark?14:24}%)`);root.style.setProperty("--bg",`hsl(${hue},32%,${dark?4:9}%)`);
 root.style.setProperty("--glow",`hsla(${hue},90%,65%,${.10+Math.random()*.25})`);
}
voiceButton.onclick=()=>{
 voiceEnabled=!voiceEnabled;voiceButton.setAttribute("aria-pressed",String(voiceEnabled));
 voiceButton.textContent=voiceEnabled?"🔊 Voice On":"🔇 Voice Off";
 if(!voiceEnabled&&"speechSynthesis"in window)speechSynthesis.cancel();
};
skinButton.onclick=randomSkin;

let touchStartY=null;
document.addEventListener("touchstart",e=>{if(e.touches.length===1)touchStartY=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{
 if(touchStartY===null)return;const dy=e.changedTouches[0].clientY-touchStartY;
 if(app.classList.contains("controls-hidden")&&dy>55)showControls(true);touchStartY=null;
},{passive:true});

randomSkin();renderControls();renderDice();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#090b10">

<title>Dice Roller</title>

<style>
:root {
  --bg1: #161a24;
  --bg2: #06070b;

  --panel: rgba(18,22,31,.88);

  --text: #ffffff;
  --muted: #aab2c0;

  --die-bg: #f8f7f2;
  --die-bg2: #ffffff;
  --pip: #12151b;

  --border: #ffffff;
  --border-width: 0px;
  --radius: 26px;

  --glow: rgba(255,255,255,0);

  --button: #ffb52e;
  --button2: #ffd36d;
  --button-text: #17120a;
}

/* =========================
   BASIC RESET
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  min-height: 100dvh;

  background:
    radial-gradient(
      circle at 50% 5%,
      var(--bg1),
      var(--bg2) 78%
    );

  color: var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  transition:
    background .35s ease;
}

/* =========================
   APP
========================= */

.app {
  width: 100%;
  height: 100dvh;

  max-width: 1100px;

  margin: 0 auto;

  padding:
    max(8px, env(safe-area-inset-top))
    12px
    max(8px, env(safe-area-inset-bottom));

  display: grid;

  grid-template-rows:
    auto
    1fr
    auto;

  gap: 7px;

  overflow: hidden;
}

/* =========================
   HEADER
========================= */

header {
  text-align: center;
}

h1 {
  margin: 0 0 7px;

  font-size:
    clamp(1.5rem, 4.5vw, 2.5rem);

  line-height: 1;

  letter-spacing: -.045em;
}

/* =========================
   CONTROLS
========================= */

.top-controls {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 7px;

  flex-wrap: wrap;
}

.small-button {
  border: 1px solid rgba(255,255,255,.18);

  background:
    rgba(255,255,255,.07);

  color: var(--text);

  border-radius: 10px;

  padding:
    7px
    11px;

  font-size: .82rem;
  font-weight: 800;

  cursor: pointer;

  touch-action: manipulation;
}

.small-button:active {
  transform: scale(.96);
}

.add-button {
  background:
    rgba(255,255,255,.1);
}

/* =========================
   DICE CONTROLS
========================= */

.dice-controls {
  display: flex;

  justify-content: center;

  align-items: center;

  gap: 6px;

  margin-top: 6px;

  min-height: 0;

  flex-wrap: wrap;
}

.die-control {
  display: flex;

  align-items: center;

  gap: 5px;

  background:
    var(--panel);

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius: 10px;

  padding:
    5px
    7px;
}

.die-control span {
  color: var(--muted);

  font-size: .72rem;

  font-weight: 800;
}

select {
  appearance: none;

  background:
    rgba(0,0,0,.32);

  color:
    var(--text);

  border:
    1px solid
    rgba(255,255,255,.22);

  border-radius: 7px;

  padding:
    5px
    23px
    5px
    7px;

  font-size: .8rem;

  font-weight: 850;
}

/* =========================
   DICE STAGE
========================= */

.stage {
  min-height: 0;

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  padding: 4px;
}

.dice {
  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-wrap: wrap;

  gap:
    clamp(8px, 2vw, 24px);

  overflow: hidden;

  position: relative;
}

/* =========================
   INDIVIDUAL DIE
========================= */

.die {
  --size:
    min(
      30vw,
      30vh,
      285px
    );

  width: var(--size);
  height: var(--size);

  min-width: 60px;
  min-height: 60px;

  max-width: 285px;
  max-height: 285px;

  flex: 0 1 auto;

  position: relative;

  background:
    linear-gradient(
      145deg,
      var(--die-bg2),
      var(--die-bg)
    );

  color:
    var(--pip);

  border:
    var(--border-width)
    solid
    var(--border);

  border-radius:
    var(--radius);

  box-shadow:
    0 14px 30px
      rgba(0,0,0,.4),

    0 0 28px
      var(--glow),

    inset 0 -5px 0
      rgba(0,0,0,.08);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size:
    clamp(
      1.8rem,
      7vw,
      4.5rem
    );

  font-weight: 950;

  user-select: none;

  transition:
    background .3s,
    color .3s,
    border .3s,
    border-radius .3s,
    box-shadow .3s;

  will-change:
    transform;
}

/* =========================
   DICE LABEL
========================= */

.die-label {
  position: absolute;

  bottom: 5px;
  right: 7px;

  font-size:
    clamp(.45rem, 1.3vw, .65rem);

  line-height: 1;

  font-weight: 900;

  opacity: .4;

  pointer-events: none;
}

/* =========================
   SIX-SIDED PIPS
========================= */

.die.pips {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  grid-template-rows:
    repeat(3, 1fr);

  padding: 10%;
}

/*
  LARGE PIPS
*/

.pip {
  width: 64%;

  aspect-ratio: 1;

  border-radius: 50%;

  background:
    var(--pip);

  place-self: center;

  opacity: 0;

  transform: scale(.4);

  transition:
    opacity .07s,
    transform .07s;
}

.pip.on {
  opacity: 1;

  transform: scale(1);
}

/* =========================
   ROLLING ANIMATION
========================= */

.die.rolling {
  animation:
    rollAcross
    .82s
    cubic-bezier(.18,.78,.25,1);
}

@keyframes rollAcross {

  0% {
    transform:
      translateX(-110vw)
      rotate(-720deg)
      scale(.7);
  }

  45% {
    transform:
      translateX(8vw)
      rotate(390deg)
      scale(1.05);
  }

  72% {
    transform:
      translateX(-3vw)
      rotate(-130deg)
      scale(.98);
  }

  88% {
    transform:
      translateX(1vw)
      rotate(35deg)
      scale(1.01);
  }

  100% {
    transform:
      translateX(0)
      rotate(0)
      scale(1);
  }
}

/* =========================
   MANY DICE
========================= */

.dice.four-plus .die {
  --size:
    min(
      20vw,
      22vh,
      175px
    );
}

.dice.six-plus .die {
  --size:
    min(
      15vw,
      18vh,
      135px
    );
}

.dice.eight-plus .die {
  --size:
    min(
      12vw,
      15vh,
      105px
    );
}

/* =========================
   BOTTOM
========================= */

.bottom {
  display: flex;

  justify-content: center;

  align-items: center;

  padding:
    2px
    0;
}

/* =========================
   BIG ROLL BUTTON
========================= */

#rollButton {
  width:
    min(
      100%,
      560px
    );

  min-height:
    clamp(
      58px,
      10vh,
      82px
    );

  border: none;

  border-radius: 18px;

  background:
    linear-gradient(
      180deg,
      var(--button2),
      var(--button)
    );

  color:
    var(--button-text);

  font-size:
    clamp(
      1.3rem,
      5vw,
      2rem
    );

  font-weight: 950;

  letter-spacing: .01em;

  box-shadow:
    0 10px 25px
      rgba(0,0,0,.35),

    0 7px 20px
      rgba(255,181,46,.2);

  cursor: pointer;

  touch-action: manipulation;

  transition:
    transform .1s,
    opacity .15s;
}

#rollButton:active {
  transform:
    scale(.975)
    translateY(2px);
}

#rollButton:disabled {
  opacity: .6;

  cursor: wait;
}

/* =========================
   SHORT LANDSCAPE SCREENS
========================= */

@media (
  orientation: landscape
) and (max-height: 520px) {

  .app {
    padding-top: 5px;

    gap: 4px;
  }

  h1 {
    font-size: 1.35rem;

    margin-bottom: 3px;
  }

  .dice-controls {
    margin-top: 3px;
  }

  .stage {
    padding: 2px;
  }

  #rollButton {
    min-height: 48px;

    font-size: 1.2rem;

    border-radius: 12px;
  }

  .die {
    --size:
      min(
        24vh,
        24vw,
        150px
      );
  }
}

/* =========================
   VERY SMALL PORTRAIT
========================= */

@media (
  orientation: portrait
) and (max-height: 650px) {

  h1 {
    font-size: 1.45rem;
  }

  .die {
    --size:
      min(
        29vw,
        25vh,
        190px
      );
  }

  #rollButton {
    min-height: 58px;
  }
}
</style>
</head>


<body>

<main class="app">

  <!-- =====================
       HEADER
  ====================== -->

  <header>

    <h1>🎲 Dice Roller</h1>

    <div class="top-controls">

      <button
        id="addDie"
        class="small-button add-button"
        type="button">
        ＋ Add Die
      </button>

      <button
        id="removeDie"
        class="small-button"
        type="button">
        − Remove Die
      </button>

      <button
        id="skinButton"
        class="small-button"
        type="button">
        🎨 Random Skin
      </button>

    </div>


    <div
      id="diceControls"
      class="dice-controls">
    </div>

  </header>


  <!-- =====================
       DICE
  ====================== -->

  <section class="stage">

    <div
      id="dice"
      class="dice">
    </div>

  </section>


  <!-- =====================
       ROLL
  ====================== -->

  <div class="bottom">

    <button
      id="rollButton"
      type="button">

      ROLL 🎲

    </button>

  </div>

</main>


<script>

/* ==========================================
   ELEMENTS
========================================== */

const diceContainer =
  document.getElementById(
    "dice"
  );

const diceControls =
  document.getElementById(
    "diceControls"
  );

const rollButton =
  document.getElementById(
    "rollButton"
  );

const addDieButton =
  document.getElementById(
    "addDie"
  );

const removeDieButton =
  document.getElementById(
    "removeDie"
  );

const skinButton =
  document.getElementById(
    "skinButton"
  );


/* ==========================================
   SETTINGS
========================================== */

const SIDE_OPTIONS = [
  2,
  4,
  6,
  8,
  10,
  12,
  20,
  100
];

const MAX_DICE = 10;
const MIN_DICE = 1;


/*
  Each entry represents one die.

  Default:
  D6 + D6
*/

let diceSettings = [
  6,
  6
];

let rolling = false;


/* ==========================================
   SIX-SIDED PIP MAP
========================================== */

const pipMap = {

  1: [4],

  2: [0,8],

  3: [0,4,8],

  4: [0,2,6,8],

  5: [0,2,4,6,8],

  6: [0,2,3,5,6,8]

};


/* ==========================================
   RANDOM NUMBER
========================================== */

function randomNumber(max) {

  return Math.floor(
    Math.random() * max
  ) + 1;

}


/* ==========================================
   BUILD SIDE SELECT
========================================== */

function createSideSelect(
  index,
  sides
) {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "die-control";


  const label =
    document.createElement(
      "span"
    );

  label.textContent =
    `D${index + 1}`;


  const select =
    document.createElement(
      "select"
    );

  select.dataset.index =
    index;


  SIDE_OPTIONS.forEach(
    optionValue => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        optionValue;

      option.textContent =
        `D${optionValue}`;


      if (
        optionValue === sides
      ) {

        option.selected =
          true;

      }


      select.appendChild(
        option
      );

    }
  );


  select.addEventListener(
    "change",
    () => {

      const dieIndex =
        Number(
          select.dataset.index
        );

      diceSettings[
        dieIndex
      ] =
        Number(
          select.value
        );

      createDice();

    }
  );


  wrapper.appendChild(
    label
  );

  wrapper.appendChild(
    select
  );


  return wrapper;

}


/* ==========================================
   UPDATE CONTROLS
========================================== */

function renderControls() {

  diceControls.innerHTML =
    "";


  diceSettings.forEach(
    (sides, index) => {

      diceControls.appendChild(
        createSideSelect(
          index,
          sides
        )
      );

    }
  );

}


/* ==========================================
   CREATE DIE
========================================== */

function createDie(
  sides,
  value
) {

  const die =
    document.createElement(
      "div"
    );

  die.className =
    "die";


  /*
    Six-sided dice use large pips.
  */

  if (
    sides === 6
  ) {

    die.classList.add(
      "pips"
    );


    for (
      let i = 0;
      i < 9;
      i++
    ) {

      const pip =
        document.createElement(
          "span"
        );

      pip.className =
        "pip";

      pip.dataset.position =
        i;

      die.appendChild(
        pip
      );

    }


    setPips(
      die,
      value
    );

  }


  /*
    Other dice show their number.
  */

  else {

    die.textContent =
      value;

  }


  /*
    Small D6 / D12 / D20 label.
  */

  const label =
    document.createElement(
      "span"
    );

  label.className =
    "die-label";

  label.textContent =
    `D${sides}`;


  die.appendChild(
    label
  );


  return die;

}


/* ==========================================
   SET PIPS
========================================== */

function setPips(
  die,
  value
) {

  const positions =
    pipMap[value] || [];


  const pips =
    die.querySelectorAll(
      ".pip"
    );


  pips.forEach(
    (pip, index) => {

      pip.classList.toggle(
        "on",
        positions.includes(
          index
        )
      );

    }
  );

}


/* ==========================================
   SET VALUE
========================================== */

function setDieValue(
  die,
  sides,
  value
) {

  if (
    sides === 6
  ) {

    setPips(
      die,
      value
    );

  }

  else {

    /*
      Preserve the D-label.
    */

    const label =
      die.querySelector(
        ".die-label"
      );


    die.childNodes.forEach(
      node => {

        if (
          node.nodeType ===
          Node.TEXT_NODE
        ) {

          node.remove();

        }

      }
    );


    die.insertBefore(
      document.createTextNode(
        value
      ),
      label
    );

  }

}


/* ==========================================
   CREATE ALL DICE
========================================== */

function createDice() {

  diceContainer.innerHTML =
    "";


  const count =
    diceSettings.length;


  diceContainer.classList.remove(
    "four-plus",
    "six-plus",
    "eight-plus"
  );


  if (
    count >= 4
  ) {

    diceContainer.classList.add(
      "four-plus"
    );

  }


  if (
    count >= 6
  ) {

    diceContainer.classList.add(
      "six-plus"
    );

  }


  if (
    count >= 8
  ) {

    diceContainer.classList.add(
      "eight-plus"
    );

  }


  diceSettings.forEach(
    sides => {

      const die =
        createDie(
          sides,
          randomNumber(
            sides
          )
        );


      diceContainer.appendChild(
        die
      );

    }
  );

}


/* ==========================================
   ADD DIE
========================================== */

addDieButton.addEventListener(
  "click",
  () => {

    if (
      diceSettings.length >=
      MAX_DICE
    ) {

      return;

    }


    /*
      New dice default to D6.
    */

    diceSettings.push(
      6
    );


    renderControls();

    createDice();

  }
);


/* ==========================================
   REMOVE DIE
========================================== */

removeDieButton.addEventListener(
  "click",
  () => {

    if (
      diceSettings.length <=
      MIN_DICE
    ) {

      return;

    }


    diceSettings.pop();


    renderControls();

    createDice();

  }
);


/* ==========================================
   ROLL ALL DICE
========================================== */

function rollDice() {

  if (
    rolling
  ) {

    return;

  }


  rolling = true;

  rollButton.disabled =
    true;


  const dice =
    [
      ...diceContainer.children
    ];


  dice.forEach(
    (die, index) => {

      const sides =
        diceSettings[index];


      /*
        Restart animation.
      */

      die.classList.remove(
        "rolling"
      );

      void die.offsetWidth;

      die.classList.add(
        "rolling"
      );


      /*
        Rapidly cycle through values.
      */

      let ticks = 0;


      const interval =
        setInterval(
          () => {

            /*
              Ignore the D-label.
            */

            const value =
              randomNumber(
                sides
              );


            setDieValue(
              die,
              sides,
              value
            );


            ticks++;


            if (
              ticks >= 9
            ) {

              clearInterval(
                interval
              );

            }

          },
          70
        );

    }
  );


  /*
    Final result.
  */

  setTimeout(
    () => {

      dice.forEach(
        (die, index) => {

          const sides =
            diceSettings[index];


          const finalValue =
            randomNumber(
              sides
            );


          setDieValue(
            die,
            sides,
            finalValue
          );


          die.classList.remove(
            "rolling"
          );

        }
      );


      rolling = false;

      rollButton.disabled =
        false;

    },
    820
  );

}


rollButton.addEventListener(
  "click",
  rollDice
);


/* ==========================================
   RANDOM SKIN
========================================== */

function randomSkin() {

  const hue =
    randomNumber(
      360
    );


  /*
    Sometimes produce a genuinely dark theme.
  */

  const dark =
    Math.random() < .55;


  let dieBg;
  let dieBg2;
  let pip;
  let border;


  if (
    dark
  ) {

    const faceLight =
      8 +
      Math.random() * 20;


    dieBg =
      `hsl(${hue}, 35%, ${faceLight}%)`;


    dieBg2 =
      `hsl(${(hue + 25) % 360}, 45%, ${
        faceLight + 9
      }%)`;


    /*
      Bright pips on dark dice.
    */

    pip =
      `hsl(${(hue + 150) % 360}, 85%, 92%)`;


    border =
      `hsl(${(hue + 35) % 360}, 90%, 65%)`;

  }

  else {

    const faceLight =
      70 +
      Math.random() * 20;


    dieBg =
      `hsl(${hue}, 60%, ${faceLight}%)`;


    dieBg2 =
      `hsl(${(hue + 25) % 360}, 65%, ${
        Math.min(
          97,
          faceLight + 10
        )
      }%)`;


    /*
      Dark pips on light dice.
    */

    pip =
      `hsl(${(hue + 170) % 360}, 60%, 12%)`;


    border =
      `hsl(${(hue + 35) % 360}, 75%, 35%)`;

  }


  const radiusOptions = [
    "12px",
    "18px",
    "24px",
    "30px",
    "38px"
  ];


  const borderOptions = [
    "0px",
    "2px",
    "3px",
    "4px"
  ];


  const radius =
    radiusOptions[
      Math.floor(
        Math.random() *
        radiusOptions.length
      )
    ];


  const borderWidth =
    borderOptions[
      Math.floor(
        Math.random() *
        borderOptions.length
      )
    ];


  const glow =
    `hsla(
      ${hue},
      90%,
      65%,
      ${0.05 + Math.random() * .28}
    )`;


  /*
    Roll button coordinates with
    the generated skin.
  */

  const buttonHue =
    (hue + 35) % 360;


  const button =
    `hsl(
      ${buttonHue},
      80%,
      ${dark ? 52 : 58}%
    )`;


  const button2 =
    `hsl(
      ${buttonHue},
      85%,
      ${dark ? 68 : 76}%
    )`;


  document.documentElement.style.setProperty(
    "--die-bg",
    dieBg
  );

  document.documentElement.style.setProperty(
    "--die-bg2",
    dieBg2
  );

  document.documentElement.style.setProperty(
    "--pip",
    pip
  );

  document.documentElement.style.setProperty(
    "--border",
    border
  );

  document.documentElement.style.setProperty(
    "--border-width",
    borderWidth
  );

  document.documentElement.style.setProperty(
    "--radius",
    radius
  );

  document.documentElement.style.setProperty(
    "--glow",
    glow
  );

  document.documentElement.style.setProperty(
    "--button",
    button
  );

  document.documentElement.style.setProperty(
    "--button2",
    button2
  );


  /*
    Darker overall background for dark skins.
  */

  document.documentElement.style.setProperty(
    "--bg1",
    dark
      ? `hsl(${hue}, 28%, 16%)`
      : `hsl(${hue}, 22%, 23%)`
  );


  document.documentElement.style.setProperty(
    "--bg2",
    dark
      ? `hsl(${hue}, 30%, 4%)`
      : `hsl(${hue}, 24%, 8%)`
  );


  /*
    Make text on the ROLL button dark
    unless the generated button itself
    becomes too dark.
  */

  document.documentElement.style.setProperty(
    "--button-text",
    "#111"
  );

}


skinButton.addEventListener(
  "click",
  randomSkin
);


/* ==========================================
   INITIALIZE
========================================== */

randomSkin();

renderControls();

createDice();

</script>

</body>
</html>

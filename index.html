<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10131a">
<title>Dice Roller</title>

<style>
:root {
  --bg1: #10131a;
  --bg2: #080a0e;
  --panel: rgba(25,30,40,.94);
  --text: #ffffff;
  --muted: #aab2c0;

  --die-bg: #fffdf8;
  --die-bg2: #fffdf8;
  --pip: #171a20;
  --border: #ffffff;
  --border-width: 0px;
  --radius: 28px;
  --glow: rgba(255,255,255,0);
  --button: #ffb52e;
  --button2: #ffd36d;
  --button-text: #17120a;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% 8%,
      var(--bg1),
      var(--bg2) 75%
    );

  color: var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  display: flex;
  justify-content: center;

  transition:
    background .35s ease;
}

.app {
  width: min(100%, 1000px);
  min-height: 100vh;

  padding:
    18px
    18px
    max(18px, env(safe-area-inset-bottom));

  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

header {
  text-align: center;
}

h1 {
  margin: 4px 0 16px;

  font-size:
    clamp(2rem, 7vw, 3.4rem);

  letter-spacing: -.045em;
}

/* =========================
   SETTINGS
========================= */

.controls {
  width: min(100%, 680px);

  margin: 0 auto;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 12px;

  flex-wrap: wrap;

  background: var(--panel);

  border: 1px solid rgba(255,255,255,.12);

  border-radius: 18px;

  padding: 13px;
}

.control {
  display: flex;
  align-items: center;
  gap: 7px;
}

.control label {
  color: var(--muted);

  font-size: .9rem;
  font-weight: 800;
}

select {
  appearance: none;

  background: rgba(0,0,0,.3);

  color: var(--text);

  border:
    1px solid
    rgba(255,255,255,.25);

  border-radius: 11px;

  padding:
    9px
    32px
    9px
    12px;

  font-size: 1rem;
  font-weight: 850;

  cursor: pointer;
}

/* =========================
   RANDOM SKIN
========================= */

.skin-area {
  display: flex;
  justify-content: center;

  margin-top: 12px;
}

.skin-button {
  border: 1px solid rgba(255,255,255,.18);

  background: rgba(255,255,255,.07);

  color: var(--text);

  border-radius: 12px;

  padding:
    9px
    16px;

  font-size: .9rem;
  font-weight: 800;

  cursor: pointer;

  transition:
    transform .12s,
    background .2s,
    border-color .2s;

  touch-action: manipulation;
}

.skin-button:active {
  transform: scale(.96);
}

.skin-button:hover {
  background: rgba(255,255,255,.12);

  border-color:
    rgba(255,255,255,.3);
}

/* =========================
   DICE STAGE
========================= */

.stage {
  flex: 1;

  min-height: 400px;

  display: flex;

  justify-content: center;
  align-items: center;

  padding:
    30px
    4px;
}

.dice {
  width: 100%;

  display: flex;

  flex-wrap: wrap;

  justify-content: center;
  align-items: center;

  gap:
    clamp(12px, 3vw, 28px);
}

/* =========================
   DICE
========================= */

.die {
  --size: min(38vw, 280px);

  width: var(--size);
  height: var(--size);

  min-width: 80px;
  min-height: 80px;

  max-width: 280px;
  max-height: 280px;

  background:
    linear-gradient(
      145deg,
      var(--die-bg2),
      var(--die-bg)
    );

  color: var(--pip);

  border:
    var(--border-width)
    solid
    var(--border);

  border-radius: var(--radius);

  box-shadow:
    0 20px 45px rgba(0,0,0,.42),
    0 0 30px var(--glow),
    inset 0 -6px 0 rgba(0,0,0,.08);

  position: relative;

  display: flex;

  justify-content: center;
  align-items: center;

  font-size:
    clamp(2rem, 10vw, 5rem);

  font-weight: 950;

  user-select: none;

  transition:
    background .35s,
    color .35s,
    border .35s,
    border-radius .35s,
    box-shadow .35s;
}

/* =========================
   SIX-SIDED PIPS
========================= */

.die.pips {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  grid-template-rows:
    repeat(3, 1fr);

  padding: 13%;
}

.pip {
  width: 42%;

  aspect-ratio: 1;

  border-radius: 50%;

  background: var(--pip);

  place-self: center;

  opacity: 0;

  transform: scale(.35);

  transition:
    opacity .08s,
    transform .08s;
}

.pip.on {
  opacity: 1;

  transform: scale(1);
}

/* =========================
   ROLLING
========================= */

.rolling {
  animation:
    tumble
    .76s
    cubic-bezier(.2,.8,.25,1);
}

@keyframes tumble {

  0% {
    transform:
      rotate(0deg)
      scale(.78);
  }

  15% {
    transform:
      rotate(20deg)
      scale(1.08);
  }

  30% {
    transform:
      rotate(-25deg)
      scale(.92);
  }

  45% {
    transform:
      rotate(21deg)
      scale(1.06);
  }

  60% {
    transform:
      rotate(-17deg)
      scale(.96);
  }

  75% {
    transform:
      rotate(10deg)
      scale(1.03);
  }

  90% {
    transform:
      rotate(-4deg)
      scale(.99);
  }

  100% {
    transform:
      rotate(0deg)
      scale(1);
  }
}

/* =========================
   PRIMARY ROLL BUTTON
========================= */

.roll-area {
  display: flex;

  justify-content: center;

  padding:
    8px
    0
    12px;
}

#rollButton {
  width: min(100%, 520px);

  min-height: 76px;

  border: none;

  border-radius: 20px;

  background:
    linear-gradient(
      180deg,
      var(--button2),
      var(--button)
    );

  color: var(--button-text);

  font-size:
    clamp(1.45rem, 6vw, 2rem);

  font-weight: 950;

  letter-spacing: .015em;

  cursor: pointer;

  box-shadow:
    0 12px 32px
    rgba(0,0,0,.3),

    0 8px 25px
    rgba(255,181,46,.22);

  touch-action: manipulation;

  transition:
    transform .1s,
    box-shadow .1s,
    opacity .15s;
}

#rollButton:active {
  transform:
    translateY(2px)
    scale(.975);

  box-shadow:
    0 6px 16px
    rgba(0,0,0,.3);
}

#rollButton:disabled {
  opacity: .6;

  cursor: wait;
}

/* =========================
   MANY DICE
========================= */

.dice.many .die {
  --size: min(18vw, 150px);
}

.dice.very-many .die {
  --size: min(14vw, 115px);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .app {
    padding-top: 12px;
  }

  .stage {
    min-height: 340px;
  }

  .die {
    --size: min(39vw, 175px);
  }

  .controls {
    gap: 9px;
  }

  #rollButton {
    min-height: 78px;
  }
}
</style>
</head>

<body>

<main class="app">

  <header>

    <h1>🎲 Dice Roller</h1>

    <div class="controls">

      <div class="control">
        <label for="diceCount">
          Dice
        </label>

        <select id="diceCount">

          <option value="1">
            1
          </option>

          <option value="2" selected>
            2
          </option>

          <option value="3">
            3
          </option>

          <option value="4">
            4
          </option>

          <option value="5">
            5
          </option>

          <option value="6">
            6
          </option>

          <option value="7">
            7
          </option>

          <option value="8">
            8
          </option>

          <option value="9">
            9
          </option>

          <option value="10">
            10
          </option>

        </select>
      </div>


      <div class="control">

        <label for="sides">
          Sides
        </label>

        <select id="sides">

          <option value="2">
            2
          </option>

          <option value="4">
            4
          </option>

          <option value="6" selected>
            6
          </option>

          <option value="8">
            8
          </option>

          <option value="10">
            10
          </option>

          <option value="12">
            12
          </option>

          <option value="20">
            20
          </option>

          <option value="100">
            100
          </option>

        </select>

      </div>

    </div>


    <div class="skin-area">

      <button
        id="skinButton"
        class="skin-button"
        type="button"
      >
        🎨 Random Skin
      </button>

    </div>

  </header>


  <section class="stage">

    <div
      id="dice"
      class="dice"
      aria-live="polite"
    ></div>

  </section>


  <div class="roll-area">

    <button
      id="rollButton"
      type="button"
    >
      ROLL 🎲
    </button>

  </div>

</main>


<script>

const diceContainer =
  document.getElementById("dice");

const diceCount =
  document.getElementById("diceCount");

const sidesSelect =
  document.getElementById("sides");

const rollButton =
  document.getElementById("rollButton");

const skinButton =
  document.getElementById("skinButton");


let rolling = false;


/* ==========================================
   SIX-SIDED DIE PIP POSITIONS
========================================== */

const pipMap = {

  1: [4],

  2: [0,8],

  3: [0,4,8],

  4: [0,2,6,8],

  5: [0,2,4,6,8],

  6: [0,2,3,5,6,8]

};


/* ==========================================
   RANDOM NUMBER
========================================== */

function randomNumber(max) {

  return Math.floor(
    Math.random() * max
  ) + 1;

}


/* ==========================================
   RANDOM COLOR HELPERS
========================================== */

function randomHue() {

  return Math.floor(
    Math.random() * 360
  );

}


/*
  Create a readable color combination.
  We use HSL so the combinations stay
  visually coordinated.
*/

function createRandomSkin() {

  const hue =
    randomHue();

  const secondHue =
    (hue + 15 + Math.floor(Math.random() * 45))
    % 360;

  const pipHue =
    (hue + 150 + Math.floor(Math.random() * 60))
    % 360;

  const borderHue =
    (hue + 30 + Math.floor(Math.random() * 90))
    % 360;


  const saturation =
    55 + Math.floor(Math.random() * 35);

  const lightness =
    35 + Math.floor(Math.random() * 28);


  /*
    Dice face stays fairly light or fairly dark.
    The pip color is deliberately pushed toward
    the opposite brightness for readability.
  */

  const darkFace =
    Math.random() < .42;


  let dieColor;
  let dieColor2;
  let pipColor;


  if (darkFace) {

    dieColor =
      `hsl(${hue}, ${saturation}%, ${lightness - 18}%)`;

    dieColor2 =
      `hsl(${secondHue}, ${saturation}%, ${lightness - 8}%)`;

    pipColor =
      `hsl(${pipHue}, 75%, 93%)`;

  } else {

    dieColor =
      `hsl(${hue}, ${saturation}%, ${lightness + 25}%)`;

    dieColor2 =
      `hsl(${secondHue}, ${saturation}%, ${lightness + 34}%)`;

    pipColor =
      `hsl(${pipHue}, 55%, 14%)`;

  }


  const borderColor =
    `hsl(${borderHue}, 75%, ${darkFace ? 78 : 30}%)`;


  const borderWidths = [
    "0px",
    "2px",
    "3px",
    "4px"
  ];

  const radii = [
    "14px",
    "20px",
    "26px",
    "32px",
    "40px"
  ];


  const borderWidth =
    borderWidths[
      Math.floor(
        Math.random() *
        borderWidths.length
      )
    ];


  const radius =
    radii[
      Math.floor(
        Math.random() *
        radii.length
      )
    ];


  const glow =
    `hsla(${hue}, 90%, 65%, ${
      .08 + Math.random() * .25
    })`;


  const buttonColor =
    `hsl(${secondHue}, 75%, 58%)`;

  const buttonColor2 =
    `hsl(${secondHue}, 80%, 75%)`;


  document.documentElement.style.setProperty(
    "--die-bg",
    dieColor
  );

  document.documentElement.style.setProperty(
    "--die-bg2",
    dieColor2
  );

  document.documentElement.style.setProperty(
    "--pip",
    pipColor
  );

  document.documentElement.style.setProperty(
    "--border",
    borderColor
  );

  document.documentElement.style.setProperty(
    "--border-width",
    borderWidth
  );

  document.documentElement.style.setProperty(
    "--radius",
    radius
  );

  document.documentElement.style.setProperty(
    "--glow",
    glow
  );

  document.documentElement.style.setProperty(
    "--button",
    buttonColor
  );

  document.documentElement.style.setProperty(
    "--button2",
    buttonColor2
  );

  /*
    Give the overall background a related
    but darker color.
  */

  document.documentElement.style.setProperty(
    "--bg1",
    `hsl(${hue}, 25%, 18%)`
  );

  document.documentElement.style.setProperty(
    "--bg2",
    `hsl(${hue}, 25%, 6%)`
  );

}


/* ==========================================
   CREATE ONE DIE
========================================== */

function createDie(
  sides,
  value
) {

  const die =
    document.createElement("div");


  die.className =
    "die";


  /*
    Six-sided dice get traditional pips.
  */

  if (sides === 6) {

    die.classList.add(
      "pips"
    );


    for (
      let i = 0;
      i < 9;
      i++
    ) {

      const pip =
        document.createElement("span");

      pip.className =
        "pip";

      pip.dataset.position =
        i;

      die.appendChild(
        pip
      );

    }


    setPips(
      die,
      value
    );

  }


  /*
    Other dice display the number.
  */

  else {

    die.textContent =
      value;

  }


  return die;

}


/* ==========================================
   SET PIPS
========================================== */

function setPips(
  die,
  value
) {

  const positions =
    pipMap[value] || [];


  const pips =
    die.querySelectorAll(
      ".pip"
    );


  pips.forEach(
    (pip, index) => {

      pip.classList.toggle(
        "on",
        positions.includes(index)
      );

    }
  );

}


/* ==========================================
   SET DIE VALUE
========================================== */

function setDieValue(
  die,
  sides,
  value
) {

  if (
    sides === 6
  ) {

    setPips(
      die,
      value
    );

  } else {

    die.textContent =
      value;

  }

}


/* ==========================================
   CREATE DICE
========================================== */

function createDice() {

  const count =
    Number(
      diceCount.value
    );

  const sides =
    Number(
      sidesSelect.value
    );


  diceContainer.innerHTML =
    "";


  diceContainer.classList.remove(
    "many",
    "very-many"
  );


  if (count >= 5) {

    diceContainer.classList.add(
      "many"
    );

  }


  if (count >= 8) {

    diceContainer.classList.add(
      "very-many"
    );

  }


  for (
    let i = 0;
    i < count;
    i++
  ) {

    const die =
      createDie(
        sides,
        randomNumber(sides)
      );


    diceContainer.appendChild(
      die
    );

  }

}


/* ==========================================
   ROLL
========================================== */

function rollDice() {

  if (rolling) return;


  rolling = true;

  rollButton.disabled =
    true;


  const sides =
    Number(
      sidesSelect.value
    );


  const dice =
    [...diceContainer.children];


  /*
    Start tumble animation.
  */

  dice.forEach(
    die => {

      die.classList.remove(
        "rolling"
      );


      /*
        Force animation restart.
      */

      void die.offsetWidth;


      die.classList.add(
        "rolling"
      );


      /*
        Rapidly change the value
        while the die is rolling.
      */

      let ticks = 0;


      const interval =
        setInterval(
          () => {

            const temporaryValue =
              randomNumber(
                sides
              );


            setDieValue(
              die,
              sides,
              temporaryValue
            );


            ticks++;


            if (
              ticks >= 8
            ) {

              clearInterval(
                interval
              );

            }

          },
          75
        );

    }
  );


  /*
    Final result.
  */

  setTimeout(
    () => {

      dice.forEach(
        die => {

          const finalValue =
            randomNumber(
              sides
            );


          setDieValue(
            die,
            sides,
            finalValue
          );


          die.classList.remove(
            "rolling"
          );

        }
      );


      rolling = false;

      rollButton.disabled =
        false;

    },
    760
  );

}


/* ==========================================
   CONTROLS
========================================== */

diceCount.addEventListener(
  "change",
  createDice
);


sidesSelect.addEventListener(
  "change",
  createDice
);


rollButton.addEventListener(
  "click",
  rollDice
);


skinButton.addEventListener(
  "click",
  createRandomSkin
);


/* ==========================================
   INITIAL SETUP
========================================== */

createRandomSkin();

createDice();

</script>

</body>
</html>

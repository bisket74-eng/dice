<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>Dice Roller</title><style>
:root{--bg:#080a0f;--bg2:#171b27;--panel:#12161fe8;--text:#fff;--muted:#aeb7c7;--pip:#11151d;--die:#f7f5ed;--die2:#fff;--edge:#fff;--edgeW:2px;--radius:24px;--glow:#ffbe3c40;--accent:#ffb82e;--accent2:#ffe083;--accentText:#161006}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 5%,var(--bg2),var(--bg) 76%)}.app{width:100%;height:100dvh;max-width:1100px;margin:auto;padding:max(6px,env(safe-area-inset-top)) 10px max(6px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;gap:5px;overflow:hidden}header{z-index:20;text-align:center;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .35s,max-height .55s;max-height:240px;overflow:hidden}h1{margin:0 0 5px;font-size:clamp(1.25rem,4vw,2.2rem);line-height:1;letter-spacing:-.04em}.top-controls,.dice-controls,.auto-controls{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap}.small-button{border:1px solid #ffffff2e;background:#ffffff13;color:#fff;border-radius:9px;padding:6px 10px;font-size:.76rem;font-weight:850;cursor:pointer;touch-action:manipulation;white-space:nowrap}.small-button:active{transform:scale(.96)}.small-button.active{background:#ffffff2e;border-color:#fff6}.dice-controls{margin-top:4px}.die-control{display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--panel);border:1px solid #ffffff1a;border-radius:8px}.die-control span,.auto-label{color:var(--muted);font-size:.65rem;font-weight:850}select{appearance:none;color:#fff;background:#0006;border:1px solid #ffffff38;border-radius:6px;padding:4px 18px 4px 6px;font-size:.74rem;font-weight:850}.auto-controls{margin-top:4px}.stage{position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;perspective:1100px}.dice{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,42px);overflow:visible}.die-wrap{position:relative;width:var(--size);height:var(--size);flex:0 0 var(--size);display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}.die{position:relative;width:100%;height:100%;border-radius:var(--radius);background:linear-gradient(145deg,var(--die2),var(--die));border:var(--edgeW) solid var(--edge);box-shadow:0 18px 35px #0000007a,0 0 35px var(--glow),inset 0 -8px 0 #00000017;transform-style:preserve-3d;user-select:none}.die.pips{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:1.5%}.pip{width:94%;aspect-ratio:1;border-radius:50%;background:var(--pip);place-self:center;box-shadow:inset 0 2px 2px #ffffff1f,0 2px 3px #0003}.die-number{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:clamp(2.5rem,9vw,5.5rem);font-weight:1000;line-height:1;color:var(--pip)}.die-label{position:absolute;right:7px;bottom:5px;font-size:.55rem;font-weight:900;opacity:.38;color:var(--pip)}.dice.count-1 .die-wrap{--size:min(68vw,64vh,470px)}.dice.count-2{flex-direction:row}.dice.count-2 .die-wrap{--size:min(39vw,42vh,300px)}.dice.count-3 .die-wrap{--size:min(28vw,34vh,220px)}.dice.count-4 .die-wrap,.dice.count-5 .die-wrap{--size:min(20vw,26vh,175px)}.dice.count-6 .die-wrap,.dice.count-7 .die-wrap{--size:min(15vw,20vh,135px)}.dice.count-8 .die-wrap,.dice.count-9 .die-wrap,.dice.count-10 .die-wrap{--size:min(12vw,16vh,105px)}.roll3d{animation:tumble 1.45s cubic-bezier(.12,.72,.18,1) both}@keyframes tumble{0%{transform:translate3d(var(--sx),var(--sy),-80px) rotateX(0) rotateY(0) rotateZ(0) scale(.72)}12%{transform:translate3d(calc(var(--sx)*.55),calc(var(--sy)*-.8),30px) rotateX(145deg) rotateY(120deg) rotateZ(85deg) scale(.9)}28%{transform:translate3d(calc(var(--sx)*-.45),calc(var(--sy)*.65),100px) rotateX(330deg) rotateY(290deg) rotateZ(205deg) scale(1.03)}44%{transform:translate3d(calc(var(--sx)*.3),calc(var(--sy)*-.45),40px) rotateX(520deg) rotateY(465deg) rotateZ(310deg) scale(.96)}60%{transform:translate3d(calc(var(--sx)*-.16),calc(var(--sy)*.25),85px) rotateX(690deg) rotateY(620deg) rotateZ(450deg) scale(1.02)}76%{transform:translate3d(calc(var(--sx)*.08),calc(var(--sy)*-.1),20px) rotateX(820deg) rotateY(760deg) rotateZ(550deg) scale(.98)}90%{transform:translate3d(calc(var(--sx)*-.025),calc(var(--sy)*.03),10px) rotateX(890deg) rotateY(850deg) rotateZ(620deg) scale(1.01)}100%{transform:translate3d(0,0,0) rotateX(900deg) rotateY(900deg) rotateZ(630deg) scale(1)}}.bounce{animation:bounce .22s ease-out}.bounce{animation:bounce .22s ease-out}@keyframes bounce{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-8px) scale(1.015)}100%{transform:translateY(0) scale(1)}}.pass-message{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transform:scale(.7);pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.2,1)}.pass-message.visible{opacity:1;transform:scale(1)}.pass-inner{padding:clamp(20px,5vw,55px) clamp(25px,7vw,75px);border-radius:28px;background:#000d;border:3px solid #ffffffb3;box-shadow:0 20px 70px #000b,0 0 50px var(--glow);backdrop-filter:blur(10px);font-size:clamp(2.2rem,10vw,6rem);line-height:.95;font-weight:1000;letter-spacing:-.045em}.bottom{display:flex;justify-content:center;align-items:center;padding:2px 0;z-index:30}#mainButton{width:min(100%,570px);min-height:clamp(56px,9vh,80px);border:0;border-radius:17px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accentText);font-size:clamp(1.25rem,5vw,2rem);font-weight:950;cursor:pointer;touch-action:manipulation;box-shadow:0 10px 26px #0006,0 7px 20px #ffb52e33}#mainButton:active{transform:scale(.975) translateY(2px)}.auto-mode{grid-template-rows:0 1fr auto}.auto-mode header{transform:translateY(calc(-100% - 20px));opacity:0;max-height:0;pointer-events:none}.auto-mode #mainButton{background:linear-gradient(180deg,#ff7878,#e53b3b);color:#fff}@media(max-width:650px) and (orientation:portrait){.dice.count-2{flex-direction:column;gap:clamp(10px,2.5vh,20px)}.dice.count-2 .die-wrap{--size:min(57vw,29vh,250px)}}@media(orientation:landscape) and (max-height:520px){.app{padding-top:3px;gap:3px}h1{font-size:1.1rem}.small-button{padding:4px 7px;font-size:.68rem}#mainButton{min-height:44px;font-size:1.05rem}.dice.count-1 .die-wrap{--size:min(38vh,34vw,255px)}.dice.count-2 .die-wrap{--size:min(32vh,34vw,230px)}}
</style></head><body><main class="app" id="app"><header><h1>🎲 Dice Roller</h1><div class="top-controls"><button class="small-button" id="addDie">＋ Add Die</button><button class="small-button" id="removeDie">− Remove Die</button><button class="small-button" id="skinButton">🎨 Random Skin</button></div><div class="dice-controls" id="diceControls"></div><div class="auto-controls"><span class="auto-label">AUTO</span><select id="intervalSelect"><option value="2">2 sec</option><option value="3" selected>3 sec</option><option value="4">4 sec</option><option value="5">5 sec</option><option value="10">10 sec</option></select><button class="small-button" id="autoButton">▶ Auto Roll</button></div></header><section class="stage"><div class="dice" id="dice"></div><div class="pass-message" id="passMessage"><div class="pass-inner">PASS THE BALL</div></div></section><div class="bottom"><button id="mainButton">ROLL 🎲</button></div></main><script>
const app=document.getElementById('app'),dice=document.getElementById('dice'),dc=document.getElementById('diceControls'),main=document.getElementById('mainButton'),add=document.getElementById('addDie'),rem=document.getElementById('removeDie'),skin=document.getElementById('skinButton'),autoBtn=document.getElementById('autoButton'),interval=document.getElementById('intervalSelect'),pass=document.getElementById('passMessage');let settings=[6,6],values=[1,1],auto=false,paused=false,rolling=false,timer=null,passTimer=null,audio=null;const pipMap={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};const rnd=n=>Math.floor(Math.random()*n)+1;
function renderControls(){dc.innerHTML='';settings.forEach((s,i)=>{let w=document.createElement('div');w.className='die-control';let l=document.createElement('span');l.textContent='D'+(i+1);let q=document.createElement('select');[2,4,6,8,10,12,20,100].forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent='D'+v;o.selected=v===s;q.appendChild(o)});q.onchange=()=>{settings[i]=+q.value;values[i]=Math.min(values[i]||1,settings[i])||1;renderDice()};w.append(l,q);dc.appendChild(w)})}
function setPips(d,v){d.querySelectorAll('.pip').forEach((p,i)=>p.classList.toggle('on',(pipMap[v]||[]).includes(i)))}function makeDie(s,v){let w=document.createElement('div');w.className='die-wrap';let d=document.createElement('div');d.className='die';if(s===6){d.classList.add('pips');for(let i=0;i<9;i++){let p=document.createElement('span');p.className='pip';d.appendChild(p)}setPips(d,v)}else{let n=document.createElement('div');n.className='die-number';n.textContent=v;d.appendChild(n)}let lab=document.createElement('span');lab.className='die-label';lab.textContent='D'+s;d.appendChild(lab);w.appendChild(d);return w}function setVal(w,s,v){let d=w.querySelector('.die');if(s===6)setPips(d,v);else d.querySelector('.die-number').textContent=v}function renderDice(){dice.innerHTML='';dice.className='dice count-'+settings.length;values=settings.map((s,i)=>Math.min(values[i]||1,s));settings.forEach((s,i)=>dice.appendChild(makeDie(s,values[i])))}
function ctx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function clack(){try{let c=ctx(),o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(115,c.currentTime);o.frequency.exponentialRampToValueAtTime(62,c.currentTime+.055);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.006);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.075);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(e){}}function rollSound(){try{let c=ctx(),b=c.createBuffer(1,c.sampleRate*.16,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/x.length,3);let s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1700;f.Q.value=.65;g.gain.value=.13;s.buffer=b;s.connect(f).connect(g).connect(c.destination);s.start()}catch(e){}}
function animateFace(w,s,final){let d=w.querySelector('.die'),n=d.querySelector('.die-number'),steps=10,iv=setInterval(()=>{if(steps--){if(s===6)setPips(d,rnd(6));else n.textContent=rnd(s);clack()}else clearInterval(iv)},120);return new Promise(r=>setTimeout(r,1450))}
async function roll(){if(rolling||paused||pass.classList.contains('visible'))return;rolling=true;let result=settings.map(rnd),wraps=[...dice.children];wraps.forEach((w,i)=>{w.classList.remove('roll3d','bounce');w.style.setProperty('--sx',i%2?'78vw':'-78vw');w.style.setProperty('--sy',(Math.random()>.5?1:-1)*(10+Math.random()*25)+'vh');void w.offsetWidth;w.classList.add('roll3d')});rollSound();await Promise.all(wraps.map((w,i)=>animateFace(w,settings[i],result[i])));wraps.forEach((w,i)=>{setVal(w,settings[i],result[i]);values[i]=result[i];w.classList.remove('roll3d');w.classList.add('bounce');setTimeout(()=>w.classList.remove('bounce'),250)});clack();rolling=false;if(auto&&settings.length===2&&result[0]===result[1])showPass();else if(auto)schedule()}
function showPass(){clearTimeout(timer);clearTimeout(passTimer);pass.classList.add('visible');passTimer=setTimeout(()=>{pass.classList.remove('visible');if(auto&&!paused)schedule()},5000)}function schedule(){clearTimeout(timer);if(auto&&!paused&&!rolling)timer=setTimeout(roll,+interval.value*1000)}function startAuto(){auto=true;paused=false;app.classList.add('auto-mode');autoBtn.textContent='⏹ Stop Auto';autoBtn.classList.add('active');main.textContent='⏸ PAUSE';roll()}function stopAuto(){auto=false;paused=false;clearTimeout(timer);clearTimeout(passTimer);pass.classList.remove('visible');app.classList.remove('auto-mode');autoBtn.textContent='▶ Auto Roll';autoBtn.classList.remove('active');main.textContent='ROLL 🎲'}function togglePause(){if(!auto||rolling)return;if(paused){paused=false;main.textContent='⏸ PAUSE';if(!pass.classList.contains('visible'))roll()}else{paused=true;clearTimeout(timer);clearTimeout(passTimer);main.textContent='▶ ROLL AGAIN'}}
main.onclick=()=>auto?togglePause():roll();autoBtn.onclick=()=>auto?stopAuto():startAuto();interval.onchange=()=>{if(auto&&!paused&&!rolling&&!pass.classList.contains('visible'))schedule()};add.onclick=()=>{if(settings.length<10){settings.push(6);values.push(1);renderControls();renderDice()}};rem.onclick=()=>{if(settings.length>1){settings.pop();values.pop();renderControls();renderDice()}};
function randomSkin(){let h=Math.random()*360,dark=Math.random()<.72,l=dark?8+Math.random()*18:70+Math.random()*20;document.documentElement.style.setProperty('--die',`hsl(${h},${dark?55:65}%,${l}%)`);document.documentElement.style.setProperty('--die2',`hsl(${(h+24)%360},${dark?60:70}%,${Math.min(97,l+10)}%)`);document.documentElement.style.setProperty('--pip',dark?`hsl(${(h+155)%360},90%,94%)`:`hsl(${(h+165)%360},60%,9%)`);document.documentElement.style.setProperty('--edge',`hsl(${(h+35)%360},85%,${dark?65:35}%)`);document.documentElement.style.setProperty('--accent',`hsl(${(h+38)%360},85%,${dark?52:58}%)`);document.documentElement.style.setProperty('--accent2',`hsl(${(h+38)%360},90%,${dark?68:78}%)`);document.documentElement.style.setProperty('--bg2',`hsl(${h},30%,${dark?14:24}%)`);document.documentElement.style.setProperty('--bg',`hsl(${h},32%,${dark?4:9}%)`);document.documentElement.style.setProperty('--glow',`hsla(${h},90%,65%,${.08+Math.random()*.25})`);document.documentElement.style.setProperty('--radius',['14px','20px','26px','32px'][Math.floor(Math.random()*4)])}skin.onclick=randomSkin;randomSkin();renderControls();renderDice();
</script></body></html>

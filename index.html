<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0,
           maximum-scale=1.0, user-scalable=no,
           viewport-fit=cover"
>

<meta name="theme-color" content="#080a0f">

<title>Dice Roller</title>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
  --bg1: #171b27;
  --bg2: #05060a;

  --panel: rgba(20,24,34,.88);

  --text: #ffffff;
  --muted: #aeb6c5;

  --die-bg: #f5f4ef;
  --die-bg2: #ffffff;

  --pip: #101319;

  --border: #ffffff;
  --border-width: 0px;
  --radius: 28px;

  --glow: rgba(255,255,255,0);

  --button: #ffb62e;
  --button2: #ffd66f;
  --button-text: #151108;
}


/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;

  overflow: hidden;
}

body {
  min-height: 100dvh;

  color: var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 50% 5%,
      var(--bg1),
      var(--bg2) 78%
    );

  transition:
    background .35s ease;
}


/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;
  height: 100dvh;

  max-width: 1100px;

  margin: 0 auto;

  padding:
    max(6px, env(safe-area-inset-top))
    10px
    max(6px, env(safe-area-inset-bottom));

  display: grid;

  grid-template-rows:
    auto
    1fr
    auto;

  gap: 5px;

  overflow: hidden;
}


/* =========================================================
   HEADER
========================================================= */

header {
  text-align: center;

  position: relative;

  z-index: 10;
}

h1 {
  margin: 0 0 5px;

  font-size:
    clamp(
      1.35rem,
      4vw,
      2.4rem
    );

  line-height: 1;

  letter-spacing: -.045em;
}


/* =========================================================
   TOP BUTTONS
========================================================= */

.top-controls {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 5px;

  flex-wrap: wrap;
}

.small-button {
  border:
    1px solid
    rgba(255,255,255,.18);

  background:
    rgba(255,255,255,.075);

  color:
    var(--text);

  border-radius: 9px;

  padding:
    6px 10px;

  font-size:
    .78rem;

  font-weight:
    850;

  cursor:
    pointer;

  touch-action:
    manipulation;

  white-space:
    nowrap;
}

.small-button:active {
  transform:
    scale(.96);
}

.small-button.active {
  background:
    rgba(255,255,255,.18);

  border-color:
    rgba(255,255,255,.4);
}


/* =========================================================
   DICE CONTROLS
========================================================= */

.dice-controls {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 4px;

  margin-top: 4px;

  flex-wrap: wrap;
}

.die-control {
  display: flex;

  align-items: center;

  gap: 4px;

  padding:
    4px 6px;

  background:
    var(--panel);

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:
    8px;
}

.die-control span {
  color:
    var(--muted);

  font-size:
    .65rem;

  font-weight:
    850;
}

select {
  appearance: none;

  color:
    var(--text);

  background:
    rgba(0,0,0,.4);

  border:
    1px solid
    rgba(255,255,255,.22);

  border-radius:
    6px;

  padding:
    4px 18px 4px 6px;

  font-size:
    .74rem;

  font-weight:
    850;
}


/* =========================================================
   AUTO CONTROLS
========================================================= */

.auto-controls {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 5px;

  margin-top: 4px;

  flex-wrap: wrap;
}

.auto-label {
  color:
    var(--muted);

  font-size:
    .7rem;

  font-weight:
    800;
}

#intervalSelect {
  min-width:
    70px;
}


/* =========================================================
   DICE STAGE
========================================================= */

.stage {
  position: relative;

  min-height: 0;

  overflow: hidden;

  display: flex;

  align-items: center;
  justify-content: center;
}


/*
  Dice arena.

  IMPORTANT:
  Nothing inside this area can cause
  the page itself to scroll.
*/

.dice {
  position: relative;

  width: 100%;
  height: 100%;

  min-height: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  gap:
    clamp(
      8px,
      2vw,
      24px
    );

  overflow: hidden;
}


/* =========================================================
   INDIVIDUAL DIE
========================================================= */

.die {
  --size:
    min(
      31vw,
      45vh,
      330px
    );

  width:
    var(--size);

  height:
    var(--size);

  min-width:
    55px;

  min-height:
    55px;

  max-width:
    330px;

  max-height:
    330px;

  flex:
    0 1 auto;

  position:
    relative;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  flex-shrink:
    1;

  background:
    linear-gradient(
      145deg,
      var(--die-bg2),
      var(--die-bg)
    );

  color:
    var(--pip);

  border:
    var(--border-width)
    solid
    var(--border);

  border-radius:
    var(--radius);

  box-shadow:
    0 16px 35px
      rgba(0,0,0,.45),

    0 0 35px
      var(--glow),

    inset 0 -7px 0
      rgba(0,0,0,.08);

  font-size:
    clamp(
      2rem,
      8vw,
      5rem
    );

  font-weight:
    950;

  line-height:
    1;

  user-select:
    none;

  will-change:
    transform;

  transition:
    background .3s ease,
    color .3s ease,
    border .3s ease,
    border-radius .3s ease,
    box-shadow .3s ease;
}


/* =========================================================
   DIE LABEL
========================================================= */

.die-label {
  position:
    absolute;

  right:
    7px;

  bottom:
    5px;

  font-size:
    clamp(
      .4rem,
      1.1vw,
      .62rem
    );

  font-weight:
    900;

  line-height:
    1;

  opacity:
    .35;

  pointer-events:
    none;
}


/* =========================================================
   HUGE SIX-SIDED PIPS
========================================================= */

.die.pips {
  display:
    grid;

  grid-template-columns:
    repeat(3, 1fr);

  grid-template-rows:
    repeat(3, 1fr);

  /*
    Almost no empty margin.
  */

  padding:
    1.5%;
}


/*
  HUGE PIPS.

  These deliberately take up most
  of each grid cell.
*/

.pip {
  width:
    94%;

  aspect-ratio:
    1 / 1;

  border-radius:
    50%;

  background:
    var(--pip);

  place-self:
    center;

  opacity:
    0;

  transform:
    scale(.3);

  transition:
    opacity .04s,
    transform .04s;
}

.pip.on {
  opacity:
    1;

  transform:
    scale(1);
}


/* =========================================================
   1 DIE
========================================================= */

.dice.count-1 .die {
  --size:
    min(
      72vw,
      67vh,
      520px
    );
}


/* =========================================================
   2 DICE
========================================================= */

/*
  On narrow phones the two dice are stacked.
*/

.dice.count-2 {
  flex-direction:
    column;

  justify-content:
    center;

  gap:
    clamp(
      6px,
      2vh,
      14px
    );
}

.dice.count-2 .die {
  --size:
    min(
      70vw,
      37vh,
      330px
    );
}


/*
  On wider screens, put them side-by-side.
*/

@media (
  min-width: 700px
) {

  .dice.count-2 {
    flex-direction:
      row;
  }

  .dice.count-2 .die {
    --size:
      min(
        40vw,
        62vh,
        390px
      );
  }

}


/* =========================================================
   3 DICE
========================================================= */

.dice.count-3 .die {
  --size:
    min(
      29vw,
      35vh,
      245px
    );
}


/* =========================================================
   4–5 DICE
========================================================= */

.dice.count-4 .die,
.dice.count-5 .die {
  --size:
    min(
      21vw,
      27vh,
      190px
    );
}


/* =========================================================
   6–7 DICE
========================================================= */

.dice.count-6 .die,
.dice.count-7 .die {
  --size:
    min(
      16vw,
      21vh,
      145px
    );
}


/* =========================================================
   8–10 DICE
========================================================= */

.dice.count-8 .die,
.dice.count-9 .die,
.dice.count-10 .die {
  --size:
    min(
      13vw,
      17vh,
      115px
    );
}


/* =========================================================
   ROLLING ANIMATIONS
========================================================= */

.die.rolling {
  animation-duration:
    1.25s;

  animation-timing-function:
    cubic-bezier(.16,.78,.22,1);

  animation-fill-mode:
    both;
}


/*
  LEFT DIE
*/

.die.roll-left {
  animation-name:
    rollLeft;
}

@keyframes rollLeft {

  0% {
    transform:
      translate(
        -80vw,
        10vh
      )
      rotate(-900deg)
      scale(.55);
  }

  20% {
    transform:
      translate(
        -34vw,
        -8vh
      )
      rotate(-500deg)
      scale(.92);
  }

  38% {
    transform:
      translate(
        31vw,
        8vh
      )
      rotate(380deg)
      scale(1.05);
  }

  53% {
    transform:
      translate(
        17vw,
        -4vh
      )
      rotate(620deg)
      scale(.96);
  }

  68% {
    transform:
      translate(
        -13vw,
        4vh
      )
      rotate(820deg)
      scale(1.02);
  }

  83% {
    transform:
      translate(
        5vw,
        -2vh
      )
      rotate(990deg)
      scale(.99);
  }

  94% {
    transform:
      translate(
        -1vw,
        1vh
      )
      rotate(1080deg)
      scale(1.01);
  }

  100% {
    transform:
      translate(0,0)
      rotate(1080deg)
      scale(1);
  }
}


/*
  RIGHT DIE
*/

.die.roll-right {
  animation-name:
    rollRight;
}

@keyframes rollRight {

  0% {
    transform:
      translate(
        80vw,
        -10vh
      )
      rotate(900deg)
      scale(.55);
  }

  20% {
    transform:
      translate(
        34vw,
        8vh
      )
      rotate(500deg)
      scale(.92);
  }

  38% {
    transform:
      translate(
        -31vw,
        -8vh
      )
      rotate(-380deg)
      scale(1.05);
  }

  53% {
    transform:
      translate(
        -17vw,
        4vh
      )
      rotate(-620deg)
      scale(.96);
  }

  68% {
    transform:
      translate(
        13vw,
        -4vh
      )
      rotate(-820deg)
      scale(1.02);
  }

  83% {
    transform:
      translate(
        -5vw,
        2vh
      )
      rotate(-990deg)
      scale(.99);
  }

  94% {
    transform:
      translate(
        1vw,
        -1vh
      )
      rotate(-1080deg)
      scale(1.01);
  }

  100% {
    transform:
      translate(0,0)
      rotate(-1080deg)
      scale(1);
  }
}


/*
  THIRD / OTHER DICE
*/

.die.roll-third {
  animation-name:
    rollThird;
}

@keyframes rollThird {

  0% {
    transform:
      translate(
        -70vw,
        -35vh
      )
      rotate(-760deg)
      scale(.5);
  }

  28% {
    transform:
      translate(
        40vw,
        18vh
      )
      rotate(520deg)
      scale(1.05);
  }

  50% {
    transform:
      translate(
        -30vw,
        -13vh
      )
      rotate(-550deg)
      scale(.94);
  }

  70% {
    transform:
      translate(
        15vw,
        7vh
      )
      rotate(790deg)
      scale(1.02);
  }

  88% {
    transform:
      translate(
        -4vw,
        -2vh
      )
      rotate(-920deg)
      scale(.99);
  }

  100% {
    transform:
      translate(0,0)
      rotate(-900deg)
      scale(1);
  }
}


/* =========================================================
   PASS THE BALL
========================================================= */

.pass-message {
  position:
    absolute;

  inset:
    0;

  z-index:
    50;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;

  padding:
    20px;

  pointer-events:
    none;

  opacity:
    0;

  transform:
    scale(.7);

  transition:
    opacity .25s ease,
    transform .3s cubic-bezier(.2,.9,.2,1);
}

.pass-message.visible {
  opacity:
    1;

  transform:
    scale(1);
}

.pass-message-inner {
  padding:
    clamp(
      20px,
      5vw,
      55px
    )
    clamp(
      25px,
      7vw,
      75px
    );

  border-radius:
    28px;

  background:
    rgba(0,0,0,.82);

  border:
    3px solid
    rgba(255,255,255,.7);

  box-shadow:
    0 20px 70px
      rgba(0,0,0,.7),

    0 0 50px
      var(--glow);

  backdrop-filter:
    blur(10px);

  font-size:
    clamp(
      2.2rem,
      10vw,
      6rem
    );

  line-height:
    .95;

  font-weight:
    1000;

  letter-spacing:
    -.045em;

  text-transform:
    uppercase;
}


/* =========================================================
   BOTTOM
========================================================= */

.bottom {
  display:
    flex;

  justify-content:
    center;

  align-items:
    center;

  padding:
    2px 0;
}


/* =========================================================
   BIG ROLL BUTTON
========================================================= */

#rollButton {
  width:
    min(
      100%,
      570px
    );

  min-height:
    clamp(
      55px,
      9vh,
      80px
    );

  border:
    none;

  border-radius:
    17px;

  background:
    linear-gradient(
      180deg,
      var(--button2),
      var(--button)
    );

  color:
    var(--button-text);

  font-size:
    clamp(
      1.25rem,
      5vw,
      2rem
    );

  font-weight:
    950;

  cursor:
    pointer;

  touch-action:
    manipulation;

  box-shadow:
    0 10px 26px
      rgba(0,0,0,.4),

    0 7px 20px
      rgba(255,181,46,.2);
}

#rollButton:active {
  transform:
    scale(.975)
    translateY(2px);
}


/* =========================================================
   LANDSCAPE / SHORT SCREENS
========================================================= */

@media (
  orientation: landscape
) and (max-height: 520px) {

  .app {
    padding-top:
      3px;

    gap:
      3px;
  }

  h1 {
    font-size:
      1.15rem;

    margin-bottom:
      2px;
  }

  .dice-controls {
    margin-top:
      2px;
  }

  .auto-controls {
    margin-top:
      2px;
  }

  #rollButton {
    min-height:
      43px;

    font-size:
      1.1rem;

    border-radius:
      11px;
  }

  .dice.count-1 .die {
    --size:
      min(
        38vh,
        35vw,
        260px
      );
  }

  .dice.count-2 {
    flex-direction:
      row;
  }

  .dice.count-2 .die {
    --size:
      min(
        32vh,
        35vw,
        250px
      );
  }
}


/* =========================================================
   VERY SHORT PHONES
========================================================= */

@media (
  max-height: 650px
) and (orientation: portrait) {

  h1 {
    font-size:
      1.25rem;
  }

  .small-button {
    padding:
      5px 8px;

    font-size:
      .7rem;
  }

  .die-control {
    padding:
      3px 5px;
  }

  .auto-controls {
    margin-top:
      2px;
  }

  #rollButton {
    min-height:
      53px;
  }
}

</style>
</head>


<body>

<main class="app">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header>

    <h1>🎲 Dice Roller</h1>

    <div class="top-controls">

      <button
        id="addDie"
        class="small-button"
        type="button">
        ＋ Add Die
      </button>

      <button
        id="removeDie"
        class="small-button"
        type="button">
        − Remove Die
      </button>

      <button
        id="skinButton"
        class="small-button"
        type="button">
        🎨 Random Skin
      </button>

    </div>


    <div
      id="diceControls"
      class="dice-controls">
    </div>


    <!-- AUTO ROLL -->

    <div class="auto-controls">

      <span class="auto-label">
        AUTO
      </span>

      <select
        id="intervalSelect">

        <option value="2">
          2 sec
        </option>

        <option value="3" selected>
          3 sec
        </option>

        <option value="4">
          4 sec
        </option>

        <option value="5">
          5 sec
        </option>

        <option value="10">
          10 sec
        </option>

      </select>


      <button
        id="autoButton"
        class="small-button"
        type="button">

        ▶ Start Auto

      </button>


      <button
        id="pauseButton"
        class="small-button"
        type="button"
        disabled>

        ⏸ Pause

      </button>

    </div>

  </header>


  <!-- =====================================================
       DICE STAGE
  ====================================================== -->

  <section class="stage">

    <div
      id="dice"
      class="dice">
    </div>


    <!-- PASS THE BALL -->

    <div
      id="passMessage"
      class="pass-message">

      <div class="pass-message-inner">
        PASS THE BALL
      </div>

    </div>

  </section>


  <!-- =====================================================
       ROLL
  ====================================================== -->

  <div class="bottom">

    <button
      id="rollButton"
      type="button">

      ROLL 🎲

    </button>

  </div>

</main>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const diceContainer =
  document.getElementById(
    "dice"
  );

const diceControls =
  document.getElementById(
    "diceControls"
  );

const rollButton =
  document.getElementById(
    "rollButton"
  );

const addDieButton =
  document.getElementById(
    "addDie"
  );

const removeDieButton =
  document.getElementById(
    "removeDie"
  );

const skinButton =
  document.getElementById(
    "skinButton"
  );

const intervalSelect =
  document.getElementById(
    "intervalSelect"
  );

const autoButton =
  document.getElementById(
    "autoButton"
  );

const pauseButton =
  document.getElementById(
    "pauseButton"
  );

const passMessage =
  document.getElementById(
    "passMessage"
  );


/* =========================================================
   SETTINGS
========================================================= */

const SIDE_OPTIONS = [
  2,
  4,
  6,
  8,
  10,
  12,
  20,
  100
];

const MAX_DICE = 10;
const MIN_DICE = 1;


/*
  Every die gets its own side count.

  Default is D6 + D6 for your
  Saran Wrap game.
*/

let diceSettings = [
  6,
  6
];


/*
  The actual current values.

  IMPORTANT:

  These values are selected BEFORE
  an animation starts.

  They do NOT change after landing.
*/

let currentValues = [
  1,
  1
];


let rolling = false;

let autoRunning = false;

let paused = false;

let autoTimer = null;


/* =========================================================
   SIX-SIDED PIP MAP
========================================================= */

const pipMap = {

  1: [4],

  2: [0, 8],

  3: [0, 4, 8],

  4: [0, 2, 6, 8],

  5: [0, 2, 4, 6, 8],

  6: [0, 2, 3, 5, 6, 8]

};


/* =========================================================
   RANDOM NUMBER
========================================================= */

function randomNumber(max) {

  return (
    Math.floor(
      Math.random() * max
    ) + 1
  );

}


/* =========================================================
   CREATE SIDE SELECT
========================================================= */

function createSideSelect(
  index,
  sides
) {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "die-control";


  const label =
    document.createElement(
      "span"
    );

  label.textContent =
    `D${index + 1}`;


  const select =
    document.createElement(
      "select"
    );

  select.dataset.index =
    index;


  SIDE_OPTIONS.forEach(
    optionValue => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        optionValue;

      option.textContent =
        `D${optionValue}`;


      if (
        optionValue === sides
      ) {

        option.selected =
          true;

      }


      select.appendChild(
        option
      );

    }
  );


  select.addEventListener(
    "change",
    () => {

      const dieIndex =
        Number(
          select.dataset.index
        );


      diceSettings[
        dieIndex
      ] =
        Number(
          select.value
        );


      /*
        Give the newly configured
        die a valid current value.
      */

      currentValues[
        dieIndex
      ] =
        randomNumber(
          diceSettings[
            dieIndex
          ]
        );


      createDice();

    }
  );


  wrapper.appendChild(
    label
  );

  wrapper.appendChild(
    select
  );


  return wrapper;

}


/* =========================================================
   RENDER CONTROLS
========================================================= */

function renderControls() {

  diceControls.innerHTML =
    "";


  diceSettings.forEach(
    (sides, index) => {

      diceControls.appendChild(
        createSideSelect(
          index,
          sides
        )
      );

    }
  );

}


/* =========================================================
   CREATE DIE
========================================================= */

function createDie(
  sides,
  value
) {

  const die =
    document.createElement(
      "div"
    );


  die.className =
    "die";


  /*
    Six-sided dice get huge pips.
  */

  if (
    sides === 6
  ) {

    die.classList.add(
      "pips"
    );


    for (
      let i = 0;
      i < 9;
      i++
    ) {

      const pip =
        document.createElement(
          "span"
        );

      pip.className =
        "pip";

      pip.dataset.position =
        i;

      die.appendChild(
        pip
      );

    }


    setPips(
      die,
      value
    );

  }

  /*
    Other dice display their number.
  */

  else {

    die.appendChild(
      document.createTextNode(
        value
      )
    );

  }


  const label =
    document.createElement(
      "span"
    );

  label.className =
    "die-label";

  label.textContent =
    `D${sides}`;


  die.appendChild(
    label
  );


  return die;

}


/* =========================================================
   SET PIPS
========================================================= */

function setPips(
  die,
  value
) {

  const positions =
    pipMap[value] || [];


  die
    .querySelectorAll(
      ".pip"
    )
    .forEach(
      (pip, index) => {

        pip.classList.toggle(
          "on",
          positions.includes(
            index
          )
        );

      }
    );

}


/* =========================================================
   SET DIE VALUE
========================================================= */

function setDieValue(
  die,
  sides,
  value
) {

  if (
    sides === 6
  ) {

    setPips(
      die,
      value
    );

    return;

  }


  const label =
    die.querySelector(
      ".die-label"
    );


  /*
    Remove only the old number.
  */

  [
    ...die.childNodes
  ].forEach(
    node => {

      if (
        node.nodeType ===
        Node.TEXT_NODE
      ) {

        node.remove();

      }

    }
  );


  die.insertBefore(
    document.createTextNode(
      value
    ),
    label
  );

}


/* =========================================================
   UPDATE DICE COUNT CLASS
========================================================= */

function updateCountClass() {

  const classes = [
    "count-1",
    "count-2",
    "count-3",
    "count-4",
    "count-5",
    "count-6",
    "count-7",
    "count-8",
    "count-9",
    "count-10"
  ];


  diceContainer.classList.remove(
    ...classes
  );


  diceContainer.classList.add(
    `count-${diceSettings.length}`
  );

}


/* =========================================================
   CREATE DICE
========================================================= */

function createDice() {

  diceContainer.innerHTML =
    "";


  updateCountClass();


  /*
    Make sure every die has
    a valid current value.
  */

  currentValues =
    diceSettings.map(
      (sides, index) => {

        const old =
          currentValues[index];


        if (
          old >= 1 &&
          old <= sides
        ) {

          return old;

        }


        return randomNumber(
          sides
        );

      }
    );


  diceSettings.forEach(
    (sides, index) => {

      const die =
        createDie(
          sides,
          currentValues[index]
        );


      diceContainer.appendChild(
        die
      );

    }
  );

}


/* =========================================================
   ADD DIE
========================================================= */

addDieButton.addEventListener(
  "click",
  () => {

    if (
      diceSettings.length >=
      MAX_DICE
    ) {

      return;

    }


    diceSettings.push(
      6
    );


    currentValues.push(
      1
    );


    renderControls();

    createDice();

  }
);


/* =========================================================
   REMOVE DIE
========================================================= */

removeDieButton.addEventListener(
  "click",
  () => {

    if (
      diceSettings.length <=
      MIN_DICE
    ) {

      return;

    }


    diceSettings.pop();

    currentValues.pop();


    renderControls();

    createDice();

  }
);


/* =========================================================
   CHOOSE FINAL RESULTS FIRST
========================================================= */

function chooseResults() {

  return diceSettings.map(
    sides =>
      randomNumber(
        sides
      )
  );

}


/* =========================================================
   CHECK DOUBLES
========================================================= */

function isDoubles(
  results
) {

  /*
    Doubles only make sense
    when exactly two dice exist.
  */

  if (
    diceSettings.length !== 2
  ) {

    return false;

  }


  /*
    D6 + D6 -> normal doubles.

    If you use D6 + D12, a matching
    number is still considered a
    match, e.g. 4 + 4.
  */

  return (
    results[0] ===
    results[1]
  );

}


/* =========================================================
   SHOW PASS MESSAGE
========================================================= */

function showPassMessage() {

  passMessage.classList.add(
    "visible"
  );

}


/* =========================================================
   HIDE PASS MESSAGE
========================================================= */

function hidePassMessage() {

  passMessage.classList.remove(
    "visible"
  );

}


/* =========================================================
   GET ANIMATION CLASS
========================================================= */

function animationClass(
  index
) {

  if (
    index % 3 === 0
  ) {

    return "roll-left";

  }

  if (
    index % 3 === 1
  ) {

    return "roll-right";

  }

  return "roll-third";

}


/* =========================================================
   ROLL DICE
========================================================= */

function rollDice() {

  /*
    Never start another roll while
    one is already happening.
  */

  if (
    rolling
  ) {

    return;

  }


  /*
    If the user manually rolls while
    the PASS message is showing,
    don't allow it.
  */

  if (
    passMessage.classList.contains(
      "visible"
    )
  ) {

    return;

  }


  rolling = true;


  /*
    ========================================================
    CRITICAL PART

    THE FINAL RESULTS ARE CHOSEN RIGHT HERE.

    They will NOT be changed again after
    the animation finishes.
    ========================================================
  */

  const finalResults =
    chooseResults();


  /*
    Remove previous animation classes.
  */

  const dice =
    [
      ...diceContainer.children
    ];


  dice.forEach(
    (die, index) => {

      die.classList.remove(
        "rolling",
        "roll-left",
        "roll-right",
        "roll-third"
      );


      /*
        Force the browser to restart
        the animation.
      */

      void die.offsetWidth;


      die.classList.add(
        animationClass(
          index
        )
      );

      die.classList.add(
        "rolling"
      );

    }
  );


  /*
    While the dice are physically
    rolling, we DO NOT change their
    displayed values.

    They already have the results
    from the previous completed roll.

    When they land, we reveal the
    predetermined result.
  */


  setTimeout(
    () => {

      dice.forEach(
        (die, index) => {

          const result =
            finalResults[index];

          const sides =
            diceSettings[index];


          /*
            This is the ONE and ONLY
            final result assignment.
          */

          setDieValue(
            die,
            sides,
            result
          );


          currentValues[index] =
            result;


          die.classList.remove(
            "rolling",
            "roll-left",
            "roll-right",
            "roll-third"
          );

        }
      );


      rolling = false;


      /*
        Now check doubles using the
        exact values that are sitting
        on the dice.
      */

      if (
        isDoubles(
          finalResults
        )
      ) {

        handleDoubles();

      }
      else {

        scheduleNextAutoRoll();

      }

    },
    1250
  );

}


/* =========================================================
   HANDLE DOUBLES
========================================================= */

function handleDoubles() {

  /*
    Only automatic play gets the
    five-second pass-the-ball pause.
  */

  if (
    !autoRunning
  ) {

    return;

  }


  showPassMessage();


  /*
    Stop any previously scheduled
    automatic roll.
  */

  clearTimeout(
    autoTimer
  );


  /*
    Exactly five seconds.
  */

  autoTimer =
    setTimeout(
      () => {

        hidePassMessage();


        /*
          If the user pressed PAUSE
          during the five seconds,
          stay paused.
        */

        if (
          paused
        ) {

          return;

        }


        scheduleNextAutoRoll();

      },
      5000
    );

}


/* =========================================================
   AUTO ROLL
========================================================= */

function scheduleNextAutoRoll() {

  clearTimeout(
    autoTimer
  );


  if (
    !autoRunning ||
    paused
  ) {

    return;

  }


  const seconds =
    Number(
      intervalSelect.value
    );


  autoTimer =
    setTimeout(
      () => {

        if (
          !autoRunning ||
          paused
        ) {

          return;

        }


        rollDice();

      },
      seconds * 1000
    );

}


/* =========================================================
   START AUTO
========================================================= */

function startAuto() {

  if (
    autoRunning
  ) {

    return;

  }


  autoRunning =
    true;

  paused =
    false;


  autoButton.textContent =
    "⏹ Stop Auto";

  autoButton.classList.add(
    "active"
  );


  pauseButton.disabled =
    false;

  pauseButton.textContent =
    "⏸ Pause";


  /*
    Start immediately rather than
    making everyone wait three seconds
    for the first roll.
  */

  rollDice();

}


/* =========================================================
   STOP AUTO
========================================================= */

function stopAuto() {

  autoRunning =
    false;

  paused =
    false;


  clearTimeout(
    autoTimer
  );


  autoTimer =
    null;


  autoButton.textContent =
    "▶ Start Auto";

  autoButton.classList.remove(
    "active"
  );


  pauseButton.disabled =
    true;

  pauseButton.textContent =
    "⏸ Pause";


  hidePassMessage();

}


/* =========================================================
   AUTO BUTTON
========================================================= */

autoButton.addEventListener(
  "click",
  () => {

    if (
      autoRunning
    ) {

      stopAuto();

    }

    else {

      startAuto();

    }

  }
);


/* =========================================================
   PAUSE / RESUME
========================================================= */

pauseButton.addEventListener(
  "click",
  () => {

    if (
      !autoRunning
    ) {

      return;

    }


    if (
      paused
    ) {

      /*
        RESUME
      */

      paused =
        false;


      pauseButton.textContent =
        "⏸ Pause";


      /*
        If PASS THE BALL is not
        currently showing, resume
        normal timing.
      */

      if (
        !passMessage.classList.contains(
          "visible"
        )
      ) {

        scheduleNextAutoRoll();

      }

    }

    else {

      /*
        PAUSE
      */

      paused =
        true;


      clearTimeout(
        autoTimer
      );


      autoTimer =
        null;


      pauseButton.textContent =
        "▶ Resume";

    }

  }
);


/* =========================================================
   CHANGE INTERVAL
========================================================= */

intervalSelect.addEventListener(
  "change",
  () => {

    /*
      If auto is currently running
      and isn't paused, restart the
      waiting period using the new
      interval.
    */

    if (
      autoRunning &&
      !paused &&
      !rolling &&
      !passMessage.classList.contains(
        "visible"
      )
    ) {

      scheduleNextAutoRoll();

    }

  }
);


/* =========================================================
   MANUAL ROLL
========================================================= */

rollButton.addEventListener(
  "click",
  () => {

    /*
      Manual ROLL works whether or
      not Auto is running.

      If Auto is running, the normal
      timer continues afterward.
    */

    if (
      !rolling &&
      !paused &&
      !passMessage.classList.contains(
        "visible"
      )
    ) {

      rollDice();

    }

  }
);


/* =========================================================
   RANDOM SKIN
========================================================= */

function randomSkin() {

  const hue =
    randomNumber(
      360
    );


  /*
    Favor darker themes.
  */

  const dark =
    Math.random() < .65;


  let dieBg;
  let dieBg2;
  let pip;
  let border;


  if (
    dark
  ) {

    const light =
      7 +
      Math.random() * 20;


    dieBg =
      `hsl(
        ${hue},
        ${35 + Math.random()*45}%,
        ${light}%
      )`;


    dieBg2 =
      `hsl(
        ${(hue + 20) % 360},
        ${45 + Math.random()*35}%,
        ${light + 10}%
      )`;


    pip =
      `hsl(
        ${(hue + 150) % 360},
        90%,
        94%
      )`;


    border =
      `hsl(
        ${(hue + 35) % 360},
        90%,
        65%
      )`;

  }

  else {

    const light =
      70 +
      Math.random() * 20;


    dieBg =
      `hsl(
        ${hue},
        60%,
        ${light}%
      )`;


    dieBg2 =
      `hsl(
        ${(hue + 25) % 360},
        65%,
        ${Math.min(
          97,
          light + 10
        )}%
      )`;


    pip =
      `hsl(
        ${(hue + 170) % 360},
        60%,
        10%
      )`;


    border =
      `hsl(
        ${(hue + 35) % 360},
        75%,
        35%
      )`;

  }


  const radiusOptions = [
    "12px",
    "18px",
    "24px",
    "30px",
    "38px"
  ];


  const borderOptions = [
    "0px",
    "2px",
    "3px",
    "4px"
  ];


  const radius =
    radiusOptions[
      Math.floor(
        Math.random() *
        radiusOptions.length
      )
    ];


  const borderWidth =
    borderOptions[
      Math.floor(
        Math.random() *
        borderOptions.length
      )
    ];


  const glow =
    `hsla(
      ${hue},
      90%,
      65%,
      ${.06 + Math.random()*.3}
    )`;


  const buttonHue =
    (hue + 35) % 360;


  const button =
    `hsl(
      ${buttonHue},
      80%,
      ${dark ? 52 : 58}%
    )`;


  const button2 =
    `hsl(
      ${buttonHue},
      85%,
      ${dark ? 68 : 76}%
    )`;


  document.documentElement.style.setProperty(
    "--die-bg",
    dieBg
  );

  document.documentElement.style.setProperty(
    "--die-bg2",
    dieBg2
  );

  document.documentElement.style.setProperty(
    "--pip",
    pip
  );

  document.documentElement.style.setProperty(
    "--border",
    border
  );

  document.documentElement.style.setProperty(
    "--border-width",
    borderWidth
  );

  document.documentElement.style.setProperty(
    "--radius",
    radius
  );

  document.documentElement.style.setProperty(
    "--glow",
    glow
  );

  document.documentElement.style.setProperty(
    "--button",
    button
  );

  document.documentElement.style.setProperty(
    "--button2",
    button2
  );


  document.documentElement.style.setProperty(
    "--bg1",

    dark
      ? `hsl(
          ${hue},
          28%,
          15%
        )`

      : `hsl(
          ${hue},
          22%,
          23%
        )`
  );


  document.documentElement.style.setProperty(
    "--bg2",

    dark
      ? `hsl(
          ${hue},
          30%,
          4%
        )`

      : `hsl(
          ${hue},
          24%,
          8%
        )`
  );

}


/* =========================================================
   SKIN BUTTON
========================================================= */

skinButton.addEventListener(
  "click",
  randomSkin
);


/* =========================================================
   INITIALIZE
========================================================= */

randomSkin();

renderControls();

createDice();

</script>

</body>
</html>

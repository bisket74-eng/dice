<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090b10">

<title>Dice Roller</title>

<style>
:root {
  --bg1: #171b27;
  --bg2: #06070b;

  --panel: rgba(18,22,31,.88);

  --text: #fff;
  --muted: #aab2c0;

  --die-bg: #f8f7f2;
  --die-bg2: #fff;
  --pip: #11151b;

  --border: #fff;
  --border-width: 0px;
  --radius: 26px;

  --glow: rgba(255,255,255,0);

  --button: #ffb52e;
  --button2: #ffd36d;
  --button-text: #17120a;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  min-height: 100dvh;

  background:
    radial-gradient(
      circle at 50% 5%,
      var(--bg1),
      var(--bg2) 78%
    );

  color: var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  transition:
    background .35s ease;
}

/* ==========================================
   APP
========================================== */

.app {
  width: 100%;
  height: 100dvh;

  max-width: 1100px;

  margin: auto;

  padding:
    max(7px, env(safe-area-inset-top))
    12px
    max(7px, env(safe-area-inset-bottom));

  display: grid;

  grid-template-rows:
    auto
    1fr
    auto;

  gap: 6px;

  overflow: hidden;
}

/* ==========================================
   HEADER
========================================== */

header {
  text-align: center;
}

h1 {
  margin: 0 0 6px;

  font-size:
    clamp(1.45rem, 4.5vw, 2.5rem);

  line-height: 1;

  letter-spacing: -.045em;
}

.top-controls {
  display: flex;

  justify-content: center;

  align-items: center;

  gap: 6px;

  flex-wrap: wrap;
}

.small-button {
  border:
    1px solid
    rgba(255,255,255,.18);

  background:
    rgba(255,255,255,.07);

  color:
    var(--text);

  border-radius: 10px;

  padding:
    6px
    11px;

  font-size: .8rem;

  font-weight: 800;

  cursor: pointer;

  touch-action: manipulation;
}

.small-button:active {
  transform: scale(.96);
}

/* ==========================================
   DICE SELECTORS
========================================== */

.dice-controls {
  display: flex;

  justify-content: center;

  align-items: center;

  gap: 5px;

  margin-top: 5px;

  flex-wrap: wrap;
}

.die-control {
  display: flex;

  align-items: center;

  gap: 4px;

  background:
    var(--panel);

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius: 9px;

  padding:
    4px
    6px;
}

.die-control span {
  color:
    var(--muted);

  font-size:
    .68rem;

  font-weight:
    850;
}

select {
  appearance: none;

  background:
    rgba(0,0,0,.35);

  color:
    var(--text);

  border:
    1px solid
    rgba(255,255,255,.22);

  border-radius:
    6px;

  padding:
    4px
    20px
    4px
    6px;

  font-size:
    .76rem;

  font-weight:
    850;
}

/* ==========================================
   DICE STAGE
========================================== */

.stage {
  min-height: 0;

  position: relative;

  overflow: hidden;

  display: flex;

  align-items: center;
  justify-content: center;
}

/*
  This is the actual arena in which
  the dice bounce and roll.
*/

.dice {
  position: relative;

  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  gap:
    clamp(10px, 2vw, 24px);

  overflow: hidden;
}

/* ==========================================
   DIE
========================================== */

.die {
  --size:
    min(
      31vw,
      32vh,
      285px
    );

  width:
    var(--size);

  height:
    var(--size);

  min-width: 60px;
  min-height: 60px;

  max-width: 285px;
  max-height: 285px;

  position: relative;

  flex: 0 1 auto;

  background:
    linear-gradient(
      145deg,
      var(--die-bg2),
      var(--die-bg)
    );

  color:
    var(--pip);

  border:
    var(--border-width)
    solid
    var(--border);

  border-radius:
    var(--radius);

  box-shadow:
    0 15px 32px
      rgba(0,0,0,.45),

    0 0 30px
      var(--glow),

    inset 0 -6px 0
      rgba(0,0,0,.08);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size:
    clamp(
      1.8rem,
      7vw,
      4.5rem
    );

  font-weight:
    950;

  user-select:
    none;

  will-change:
    transform;

  transition:
    background .3s,
    color .3s,
    border .3s,
    border-radius .3s,
    box-shadow .3s;
}

/* ==========================================
   D6 LABEL
========================================== */

.die-label {
  position: absolute;

  right: 7px;
  bottom: 5px;

  font-size:
    clamp(
      .42rem,
      1.2vw,
      .62rem
    );

  line-height: 1;

  font-weight: 900;

  opacity: .38;

  pointer-events: none;
}

/* ==========================================
   HUGE PIPS
========================================== */

.die.pips {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  grid-template-rows:
    repeat(3, 1fr);

  /*
    MUCH less empty padding.
    This lets the pips occupy almost
    the entire face.
  */

  padding: 4%;
}

/*
  These are deliberately enormous.
*/

.pip {
  width: 88%;

  aspect-ratio: 1;

  border-radius: 50%;

  background:
    var(--pip);

  place-self: center;

  opacity: 0;

  transform:
    scale(.3);

  transition:
    opacity .05s,
    transform .05s;
}

.pip.on {
  opacity: 1;

  transform:
    scale(1);
}

/* ==========================================
   BOUNCING ROLL ANIMATION
========================================== */

/*
  Each die gets a different animation
  so they move independently.
*/

.die.rolling {
  animation-duration:
    1.15s;

  animation-timing-function:
    cubic-bezier(.18,.8,.25,1);

  animation-fill-mode:
    both;
}

/*
  Die #1:
  Comes from the left,
  bounces toward the right,
  then lands in the middle.
*/

.die.roll-left {
  animation-name:
    rollFromLeft;
}

@keyframes rollFromLeft {

  0% {
    transform:
      translate(
        -65vw,
        12vh
      )
      rotate(-720deg)
      scale(.72);
  }

  25% {
    transform:
      translate(
        -22vw,
        -5vh
      )
      rotate(260deg)
      scale(1.04);
  }

  45% {
    transform:
      translate(
        25vw,
        7vh
      )
      rotate(620deg)
      scale(.95);
  }

  62% {
    transform:
      translate(
        13vw,
        -3vh
      )
      rotate(800deg)
      scale(1.02);
  }

  77% {
    transform:
      translate(
        -5vw,
        2vh
      )
      rotate(960deg)
      scale(.98);
  }

  90% {
    transform:
      translate(
        2vw,
        -1vh
      )
      rotate(1080deg)
      scale(1.01);
  }

  100% {
    transform:
      translate(
        0,
        0
      )
      rotate(1080deg)
      scale(1);
  }
}

/*
  Die #2:
  Comes from the right and follows
  a different bouncing path.
*/

.die.roll-right {
  animation-name:
    rollFromRight;
}

@keyframes rollFromRight {

  0% {
    transform:
      translate(
        65vw,
        -10vh
      )
      rotate(720deg)
      scale(.72);
  }

  23% {
    transform:
      translate(
        20vw,
        8vh
      )
      rotate(-260deg)
      scale(1.05);
  }

  43% {
    transform:
      translate(
        -26vw,
        -5vh
      )
      rotate(-620deg)
      scale(.94);
  }

  60% {
    transform:
      translate(
        -13vw,
        4vh
      )
      rotate(-820deg)
      scale(1.03);
  }

  77% {
    transform:
      translate(
        6vw,
        -2vh
      )
      rotate(-970deg)
      scale(.98);
  }

  91% {
    transform:
      translate(
        -2vw,
        1vh
      )
      rotate(-1080deg)
      scale(1.01);
  }

  100% {
    transform:
      translate(
        0,
        0
      )
      rotate(-1080deg)
      scale(1);
  }
}

/*
  Additional dice get their own
  independent paths.
*/

.die.roll-third {
  animation-name:
    rollThird;
}

@keyframes rollThird {

  0% {
    transform:
      translate(
        -50vw,
        -30vh
      )
      rotate(-540deg)
      scale(.65);
  }

  35% {
    transform:
      translate(
        30vw,
        15vh
      )
      rotate(450deg)
      scale(1.04);
  }

  60% {
    transform:
      translate(
        -18vw,
        -8vh
      )
      rotate(-700deg)
      scale(.96);
  }

  82% {
    transform:
      translate(
        5vw,
        3vh
      )
      rotate(860deg)
      scale(1.01);
  }

  100% {
    transform:
      translate(0,0)
      rotate(900deg)
      scale(1);
  }
}

/* ==========================================
   MANY DICE
========================================== */

.dice.four-plus .die {

  --size:
    min(
      20vw,
      22vh,
      175px
    );
}

.dice.six-plus .die {

  --size:
    min(
      15vw,
      18vh,
      135px
    );
}

.dice.eight-plus .die {

  --size:
    min(
      12vw,
      15vh,
      105px
    );
}

/* ==========================================
   ROLL BUTTON
========================================== */

.bottom {
  display:
    flex;

  justify-content:
    center;

  padding:
    2px
    0;
}

#rollButton {

  width:
    min(
      100%,
      560px
    );

  min-height:
    clamp(
      58px,
      10vh,
      82px
    );

  border:
    none;

  border-radius:
    18px;

  background:
    linear-gradient(
      180deg,
      var(--button2),
      var(--button)
    );

  color:
    var(--button-text);

  font-size:
    clamp(
      1.3rem,
      5vw,
      2rem
    );

  font-weight:
    950;

  cursor:
    pointer;

  box-shadow:
    0 10px 25px
      rgba(0,0,0,.35),

    0 7px 20px
      rgba(255,181,46,.2);

  touch-action:
    manipulation;
}

#rollButton:active {

  transform:
    scale(.975)
    translateY(2px);
}

#rollButton:disabled {

  opacity:
    .6;

  cursor:
    wait;
}

/* ==========================================
   LANDSCAPE
========================================== */

@media (
  orientation: landscape
) and (max-height: 520px) {

  .app {
    padding-top: 4px;

    gap: 3px;
  }

  h1 {
    font-size:
      1.25rem;

    margin-bottom:
      2px;
  }

  .dice-controls {
    margin-top:
      2px;
  }

  .stage {
    padding:
      2px;
  }

  #rollButton {
    min-height:
      45px;

    font-size:
      1.15rem;

    border-radius:
      11px;
  }

  .die {
    --size:
      min(
        24vh,
        24vw,
        150px
      );
  }
}

/* ==========================================
   SHORT PORTRAIT
========================================== */

@media (
  orientation: portrait
) and (max-height: 650px) {

  h1 {
    font-size:
      1.35rem;
  }

  .die {
    --size:
      min(
        29vw,
        25vh,
        190px
      );
  }

  #rollButton {
    min-height:
      56px;
  }
}
</style>
</head>


<body>

<main class="app">

<header>

  <h1>🎲 Dice Roller</h1>

  <div class="top-controls">

    <button
      id="addDie"
      class="small-button"
      type="button">
      ＋ Add Die
    </button>

    <button
      id="removeDie"
      class="small-button"
      type="button">
      − Remove Die
    </button>

    <button
      id="skinButton"
      class="small-button"
      type="button">
      🎨 Random Skin
    </button>

  </div>

  <div
    id="diceControls"
    class="dice-controls">
  </div>

</header>


<section class="stage">

  <div
    id="dice"
    class="dice">
  </div>

</section>


<div class="bottom">

  <button
    id="rollButton"
    type="button">

    ROLL 🎲

  </button>

</div>

</main>


<script>

/* ==========================================
   ELEMENTS
========================================== */

const diceContainer =
  document.getElementById(
    "dice"
  );

const diceControls =
  document.getElementById(
    "diceControls"
  );

const rollButton =
  document.getElementById(
    "rollButton"
  );

const addDieButton =
  document.getElementById(
    "addDie"
  );

const removeDieButton =
  document.getElementById(
    "removeDie"
  );

const skinButton =
  document.getElementById(
    "skinButton"
  );


/* ==========================================
   SETTINGS
========================================== */

const SIDE_OPTIONS = [
  2,
  4,
  6,
  8,
  10,
  12,
  20,
  100
];

const MAX_DICE = 10;

const MIN_DICE = 1;


/*
  Each die has its own sides.

  Default:
  D6 + D6
*/

let diceSettings = [
  6,
  6
];

let rolling = false;


/* ==========================================
   PIP MAP
========================================== */

const pipMap = {

  1: [4],

  2: [0,8],

  3: [0,4,8],

  4: [0,2,6,8],

  5: [0,2,4,6,8],

  6: [0,2,3,5,6,8]

};


/* ==========================================
   RANDOM NUMBER
========================================== */

function randomNumber(
  max
) {

  return Math.floor(
    Math.random() * max
  ) + 1;

}


/* ==========================================
   SIDE SELECTOR
========================================== */

function createSideSelect(
  index,
  sides
) {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "die-control";


  const label =
    document.createElement(
      "span"
    );

  label.textContent =
    `D${index + 1}`;


  const select =
    document.createElement(
      "select"
    );

  select.dataset.index =
    index;


  SIDE_OPTIONS.forEach(
    optionValue => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        optionValue;

      option.textContent =
        `D${optionValue}`;


      if (
        optionValue === sides
      ) {

        option.selected =
          true;

      }


      select.appendChild(
        option
      );

    }
  );


  select.addEventListener(
    "change",
    () => {

      const dieIndex =
        Number(
          select.dataset.index
        );


      diceSettings[
        dieIndex
      ] =
        Number(
          select.value
        );


      createDice();

    }
  );


  wrapper.appendChild(
    label
  );

  wrapper.appendChild(
    select
  );


  return wrapper;

}


/* ==========================================
   RENDER CONTROLS
========================================== */

function renderControls() {

  diceControls.innerHTML =
    "";


  diceSettings.forEach(
    (sides, index) => {

      diceControls.appendChild(
        createSideSelect(
          index,
          sides
        )
      );

    }
  );

}


/* ==========================================
   CREATE DIE
========================================== */

function createDie(
  sides,
  value
) {

  const die =
    document.createElement(
      "div"
    );


  die.className =
    "die";


  if (
    sides === 6
  ) {

    die.classList.add(
      "pips"
    );


    for (
      let i = 0;
      i < 9;
      i++
    ) {

      const pip =
        document.createElement(
          "span"
        );

      pip.className =
        "pip";

      pip.dataset.position =
        i;

      die.appendChild(
        pip
      );

    }


    setPips(
      die,
      value
    );

  }

  else {

    die.appendChild(
      document.createTextNode(
        value
      )
    );

  }


  const label =
    document.createElement(
      "span"
    );

  label.className =
    "die-label";

  label.textContent =
    `D${sides}`;


  die.appendChild(
    label
  );


  return die;

}


/* ==========================================
   SET PIPS
========================================== */

function setPips(
  die,
  value
) {

  const positions =
    pipMap[value] || [];


  die
    .querySelectorAll(
      ".pip"
    )
    .forEach(
      (pip, index) => {

        pip.classList.toggle(
          "on",
          positions.includes(
            index
          )
        );

      }
    );

}


/* ==========================================
   SET DIE VALUE
========================================== */

function setDieValue(
  die,
  sides,
  value
) {

  if (
    sides === 6
  ) {

    setPips(
      die,
      value
    );

    return;

  }


  const label =
    die.querySelector(
      ".die-label"
    );


  /*
    Remove old number text.
  */

  [...die.childNodes]
    .forEach(
      node => {

        if (
          node.nodeType ===
          Node.TEXT_NODE
        ) {

          node.remove();

        }

      }
    );


  die.insertBefore(
    document.createTextNode(
      value
    ),
    label
  );

}


/* ==========================================
   CREATE DICE
========================================== */

function createDice() {

  diceContainer.innerHTML =
    "";


  const count =
    diceSettings.length;


  diceContainer.classList.remove(
    "four-plus",
    "six-plus",
    "eight-plus"
  );


  if (
    count >= 4
  ) {

    diceContainer.classList.add(
      "four-plus"
    );

  }


  if (
    count >= 6
  ) {

    diceContainer.classList.add(
      "six-plus"
    );

  }


  if (
    count >= 8
  ) {

    diceContainer.classList.add(
      "eight-plus"
    );

  }


  diceSettings.forEach(
    (sides) => {

      const die =
        createDie(
          sides,
          randomNumber(
            sides
          )
        );


      diceContainer.appendChild(
        die
      );

    }
  );

}


/* ==========================================
   ADD DIE
========================================== */

addDieButton.addEventListener(
  "click",
  () => {

    if (
      diceSettings.length >=
      MAX_DICE
    ) {

      return;

    }


    diceSettings.push(
      6
    );


    renderControls();

    createDice();

  }
);


/* ==========================================
   REMOVE DIE
========================================== */

removeDieButton.addEventListener(
  "click",
  () => {

    if (
      diceSettings.length <=
      MIN_DICE
    ) {

      return;

    }


    diceSettings.pop();


    renderControls();

    createDice();

  }
);


/* ==========================================
   ROLL
========================================== */

function rollDice() {

  if (
    rolling
  ) {

    return;

  }


  rolling = true;

  rollButton.disabled =
    true;


  const dice =
    [
      ...diceContainer.children
    ];


  /*
    Give every die its own
    independent trajectory.
  */

  dice.forEach(
    (die, index) => {

      die.classList.remove(
        "rolling",
        "roll-left",
        "roll-right",
        "roll-third"
      );


      /*
        Force animation restart.
      */

      void die.offsetWidth;


      /*
        Pick trajectory based on die.
      */

      if (
        index % 3 === 0
      ) {

        die.classList.add(
          "roll-left"
        );

      }

      else if (
        index % 3 === 1
      ) {

        die.classList.add(
          "roll-right"
        );

      }

      else {

        die.classList.add(
          "roll-third"
        );

      }


      die.classList.add(
        "rolling"
      );


      /*
        Rapidly change the face
        while it is traveling.
      */

      const sides =
        diceSettings[index];


      let ticks = 0;


      const interval =
        setInterval(
          () => {

            const value =
              randomNumber(
                sides
              );


            setDieValue(
              die,
              sides,
              value
            );


            ticks++;


            if (
              ticks >= 11
            ) {

              clearInterval(
                interval
              );

            }

          },
          70
        );

    }
  );


  /*
    Final landing.
  */

  setTimeout(
    () => {

      dice.forEach(
        (die, index) => {

          const sides =
            diceSettings[index];


          const finalValue =
            randomNumber(
              sides
            );


          setDieValue(
            die,
            sides,
            finalValue
          );


          die.classList.remove(
            "rolling",
            "roll-left",
            "roll-right",
            "roll-third"
          );

        }
      );


      rolling = false;

      rollButton.disabled =
        false;

    },
    1160
  );

}


rollButton.addEventListener(
  "click",
  rollDice
);


/* ==========================================
   RANDOM SKIN
========================================== */

function randomSkin() {

  const hue =
    randomNumber(
      360
    );


  /*
    More than half the skins
    are dark.
  */

  const dark =
    Math.random() < .62;


  let dieBg;
  let dieBg2;
  let pip;
  let border;


  if (
    dark
  ) {

    const light =
      7 +
      Math.random() * 21;


    dieBg =
      `hsl(
        ${hue},
        ${35 + Math.random()*45}%,
        ${light}%
      )`;


    dieBg2 =
      `hsl(
        ${(hue + 20) % 360},
        ${45 + Math.random()*35}%,
        ${light + 10}%
      )`;


    pip =
      `hsl(
        ${(hue + 150) % 360},
        85%,
        93%
      )`;


    border =
      `hsl(
        ${(hue + 35) % 360},
        90%,
        65%
      )`;

  }

  else {

    const light =
      70 +
      Math.random() * 20;


    dieBg =
      `hsl(
        ${hue},
        60%,
        ${light}%
      )`;


    dieBg2 =
      `hsl(
        ${(hue + 25) % 360},
        65%,
        ${Math.min(97, light + 10)}%
      )`;


    pip =
      `hsl(
        ${(hue + 170) % 360},
        60%,
        12%
      )`;


    border =
      `hsl(
        ${(hue + 35) % 360},
        75%,
        35%
      )`;

  }


  const radiusOptions = [
    "12px",
    "18px",
    "24px",
    "30px",
    "38px"
  ];


  const borderOptions = [
    "0px",
    "2px",
    "3px",
    "4px"
  ];


  const radius =
    radiusOptions[
      Math.floor(
        Math.random() *
        radiusOptions.length
      )
    ];


  const borderWidth =
    borderOptions[
      Math.floor(
        Math.random() *
        borderOptions.length
      )
    ];


  const glow =
    `hsla(
      ${hue},
      90%,
      65%,
      ${.06 + Math.random()*.3}
    )`;


  const buttonHue =
    (hue + 35) % 360;


  const button =
    `hsl(
      ${buttonHue},
      80%,
      ${dark ? 52 : 58}%
    )`;


  const button2 =
    `hsl(
      ${buttonHue},
      85%,
      ${dark ? 68 : 76}%
    )`;


  document.documentElement.style.setProperty(
    "--die-bg",
    dieBg
  );

  document.documentElement.style.setProperty(
    "--die-bg2",
    dieBg2
  );

  document.documentElement.style.setProperty(
    "--pip",
    pip
  );

  document.documentElement.style.setProperty(
    "--border",
    border
  );

  document.documentElement.style.setProperty(
    "--border-width",
    borderWidth
  );

  document.documentElement.style.setProperty(
    "--radius",
    radius
  );

  document.documentElement.style.setProperty(
    "--glow",
    glow
  );

  document.documentElement.style.setProperty(
    "--button",
    button
  );

  document.documentElement.style.setProperty(
    "--button2",
    button2
  );


  document.documentElement.style.setProperty(
    "--bg1",
    dark
      ? `hsl(${hue}, 28%, 15%)`
      : `hsl(${hue}, 22%, 23%)`
  );


  document.documentElement.style.setProperty(
    "--bg2",
    dark
      ? `hsl(${hue}, 30%, 4%)`
      : `hsl(${hue}, 24%, 8%)`
  );

}


skinButton.addEventListener(
  "click",
  randomSkin
);


/* ==========================================
   INITIALIZE
========================================== */

randomSkin();

renderControls();

createDice();

</script>

</body>
</html>

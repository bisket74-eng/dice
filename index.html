<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>Dice Roller</title>
<style>
:root{
  --bg:#080a0f;--bg2:#171b27;--panel:#121722ee;--text:#fff;--muted:#aeb7c7;
  --die:#f7f5ed;--die2:#fff;--pip:#11151d;--edge:#fff;
  --accent:#ffb82e;--accent2:#ffe083;--accentText:#161006;--glow:#ffbe3c55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:var(--bg);
}
body{
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 50% 5%,var(--bg2),var(--bg) 78%);
}
body:fullscreen,body:-webkit-full-screen{width:100vw;height:100dvh;overflow:hidden}

.app{
  width:100%;height:100dvh;max-width:1100px;margin:auto;
  padding:max(5px,env(safe-area-inset-top)) 10px max(5px,env(safe-area-inset-bottom));
  display:grid;grid-template-rows:auto 1fr auto;gap:5px;overflow:hidden;
}
header{
  z-index:20;text-align:center;max-height:240px;overflow:hidden;
  transition:transform .62s cubic-bezier(.18,.8,.18,1),opacity .38s ease,max-height .62s ease;
}
h1{margin:0 0 5px;font-size:clamp(1.2rem,4vw,2.1rem);line-height:1;letter-spacing:-.04em}
.top-controls,.dice-controls,.auto-controls{
  display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;
}
.small-button{
  border:1px solid #ffffff2e;background:#ffffff12;color:#fff;border-radius:9px;
  padding:6px 10px;font-size:.76rem;font-weight:850;cursor:pointer;touch-action:manipulation;
}
.small-button:active{transform:scale(.96)}
.small-button.active{background:#ffffff30;border-color:#ffffff66}
.dice-controls{margin-top:4px}
.die-control{
  display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--panel);
  border:1px solid #ffffff1a;border-radius:8px;
}
.die-control span,.auto-label{color:var(--muted);font-size:.65rem;font-weight:850}
select{
  appearance:none;color:#fff;background:#0007;border:1px solid #ffffff38;border-radius:6px;
  padding:4px 18px 4px 6px;font-size:.74rem;font-weight:850;
}
.auto-controls{margin-top:4px}

.stage{
  position:relative;min-height:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  perspective:1400px;perspective-origin:50% 48%;
}

/* Three dice per row. Additional dice always wrap to another row. */
.dice{
  position:relative;width:min(100%,1050px);height:100%;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-rows:minmax(0,1fr);
  align-items:center;justify-items:center;align-content:center;
  column-gap:clamp(8px,2.5vw,30px);
  row-gap:clamp(10px,3vh,28px);
  overflow:visible;padding:clamp(4px,1vw,14px);
}
.die-wrap{
  position:relative;width:var(--size);height:var(--size);
  flex:0 0 var(--size);display:grid;place-items:center;
  transform-style:preserve-3d;will-change:transform;
}

/* Keep the original D6 cube/pips intact. */
.die-cube{
  width:100%;height:100%;position:relative;transform-style:preserve-3d;
  transform-origin:center center;
}
.face{
  position:absolute;inset:0;width:100%;height:100%;
  border-radius:clamp(12px,3vw,28px);
  background:linear-gradient(145deg,var(--die2),var(--die));
  border:2px solid var(--edge);
  box-shadow:inset 0 -8px 0 #00000016,inset 0 2px 5px #ffffff42;
  backface-visibility:hidden;display:grid;place-items:center;
}
.face.front{transform:translateZ(var(--depth))}
.face.back{transform:rotateY(180deg) translateZ(var(--depth))}
.face.right{transform:rotateY(90deg) translateZ(var(--depth))}
.face.left{transform:rotateY(-90deg) translateZ(var(--depth))}
.face.top{transform:rotateX(90deg) translateZ(var(--depth))}
.face.bottom{transform:rotateX(-90deg) translateZ(var(--depth))}
.pips{
  width:88%;height:88%;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
}
.pip{
  width:88%;aspect-ratio:1;border-radius:50%;background:var(--pip);place-self:center;
  box-shadow:inset 0 2px 3px #ffffff20,0 3px 5px #0004;
}

/* Generic numbered dice. These are real polygon silhouettes rather than a
   single rectangular face, so D4/D8/D10/D12/D20/D100 each has its own shape. */
.generic-wrap .generic-svg{
  width:100%;height:100%;display:block;overflow:visible;
  filter:drop-shadow(0 10px 12px #0006);
}
.generic-wrap .generic-shape{
  fill:url(#genericGradient);
  stroke:var(--edge);stroke-width:2.2;
  vector-effect:non-scaling-stroke;
}
.generic-wrap .generic-result{
  fill:var(--pip);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:clamp(22px,8vw,58px);font-weight:1000;
  dominant-baseline:middle;text-anchor:middle;
  paint-order:stroke;stroke:transparent;stroke-width:2px;
}
.generic-wrap .generic-label{
  fill:var(--pip);opacity:.38;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:7px;font-weight:900;text-anchor:end;
}
.generic-wrap.rolling .generic-result{opacity:0}
.generic-wrap.rolling{
  animation:genericTravel 1.65s cubic-bezier(.13,.78,.18,1) both;
}
@keyframes genericTravel{
  0%{transform:translate3d(var(--fromX),var(--fromY),-100px) scale(.62) rotate(-35deg)}
  14%{transform:translate3d(calc(var(--fromX)*.55),calc(var(--fromY)*-.75),70px) scale(.86) rotate(80deg)}
  31%{transform:translate3d(calc(var(--fromX)*-.38),calc(var(--fromY)*.55),120px) scale(1.02) rotate(175deg)}
  48%{transform:translate3d(calc(var(--fromX)*.25),calc(var(--fromY)*-.38),55px) scale(.95) rotate(270deg)}
  66%{transform:translate3d(calc(var(--fromX)*-.12),calc(var(--fromY)*.2),80px) scale(1.02) rotate(385deg)}
  82%{transform:translate3d(calc(var(--fromX)*.04),calc(var(--fromY)*-.06),20px) scale(.99) rotate(470deg)}
  93%{transform:translate3d(0,0,8px) scale(1.015) rotate(535deg)}
  100%{transform:translate3d(0,0,0) scale(1) rotate(540deg)}
}

/* D2 is a visible two-sided coin. It never disappears during a roll. */
.coin-wrap{perspective:900px}
.coin{
  width:86%;height:86%;position:relative;transform-style:preserve-3d;
  border-radius:50%;will-change:transform;
}
.coin-face{
  position:absolute;inset:0;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 32% 25%,var(--die2),var(--die) 62%,#0002);
  border:3px solid var(--edge);
  box-shadow:inset 0 -10px 12px #0003,0 10px 18px #0007;
  backface-visibility:hidden;
  color:var(--pip);font-size:clamp(3rem,11vw,6.5rem);font-weight:1000;
  line-height:1;
}
.coin-face.back{transform:rotateY(180deg)}
.coin.rolling{animation:coinFlip 1.65s cubic-bezier(.12,.78,.18,1) both}
@keyframes coinFlip{
  0%{transform:translate3d(var(--fromX),var(--fromY),-80px) rotateY(0deg) rotateZ(-20deg) scale(.72)}
  20%{transform:translate3d(calc(var(--fromX)*-.35),calc(var(--fromY)*-.7),90px) rotateY(720deg) rotateZ(80deg) scale(.92)}
  45%{transform:translate3d(calc(var(--fromX)*.25),calc(var(--fromY)*.45),120px) rotateY(1260deg) rotateZ(170deg) scale(1.04)}
  70%{transform:translate3d(calc(var(--fromX)*-.1),calc(var(--fromY)*-.18),60px) rotateY(1800deg) rotateZ(255deg) scale(1)}
  90%{transform:translate3d(0,0,15px) rotateY(2160deg) rotateZ(335deg) scale(1.02)}
  100%{transform:translate3d(0,0,0) rotateY(2160deg) rotateZ(360deg) scale(1)}
}
.coin.settle{animation:coinSettle .25s ease-out}
@keyframes coinSettle{
  0%{transform:scale(1)}40%{transform:scale(1.04) translateY(-7px)}100%{transform:scale(1)}
}

.num{
  color:var(--pip);font-size:clamp(2.4rem,9vw,6rem);font-weight:1000;
  line-height:1;letter-spacing:-.06em;
}
.die-label{
  position:absolute;right:7px;bottom:5px;color:var(--pip);opacity:.35;
  font-size:.55rem;font-weight:900;
}

/* Sizes: 1 large, 2 comfortable side-by-side, 3 per row, then smaller rows. */
.dice.count-1 .die-wrap{--size:min(70vw,66vh,470px)}
.dice.count-2 .die-wrap{--size:min(40vw,38vh,270px)}
.dice.count-3 .die-wrap{--size:min(29vw,34vh,235px)}
.dice.count-4 .die-wrap,.dice.count-5 .die-wrap{--size:min(25vw,28vh,210px)}
.dice.count-6 .die-wrap,.dice.count-7 .die-wrap{--size:min(23vw,24vh,180px)}
.dice.count-8 .die-wrap,.dice.count-9 .die-wrap,.dice.count-10 .die-wrap{--size:min(21vw,21vh,160px)}

.roll .die-wrap{animation:travelRoll 1.65s cubic-bezier(.13,.78,.18,1) both}
.roll .die-cube,.die-cube.cube-rolling{
  animation:cubeTumble 1.65s cubic-bezier(.12,.78,.18,1) both;
}
@keyframes travelRoll{
  0%{transform:translate3d(var(--fromX),var(--fromY),-100px) scale(.62)}
  14%{transform:translate3d(calc(var(--fromX)*.55),calc(var(--fromY)*-.75),70px) scale(.86)}
  31%{transform:translate3d(calc(var(--fromX)*-.38),calc(var(--fromY)*.55),120px) scale(1.02)}
  48%{transform:translate3d(calc(var(--fromX)*.25),calc(var(--fromY)*-.38),55px) scale(.95)}
  66%{transform:translate3d(calc(var(--fromX)*-.12),calc(var(--fromY)*.2),80px) scale(1.02)}
  82%{transform:translate3d(calc(var(--fromX)*.04),calc(var(--fromY)*-.06),20px) scale(.99)}
  93%{transform:translate3d(0,0,8px) scale(1.015)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
@keyframes cubeTumble{
  0%{transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg)}
  13%{transform:rotateX(150deg) rotateY(125deg) rotateZ(85deg)}
  29%{transform:rotateX(330deg) rotateY(285deg) rotateZ(205deg)}
  47%{transform:rotateX(555deg) rotateY(470deg) rotateZ(325deg)}
  64%{transform:rotateX(760deg) rotateY(650deg) rotateZ(455deg)}
  81%{transform:rotateX(930deg) rotateY(815deg) rotateZ(575deg)}
  93%{transform:rotateX(1020deg) rotateY(900deg) rotateZ(635deg)}
  100%{transform:rotateX(1080deg) rotateY(990deg) rotateZ(690deg)}
}
.settle{animation:settle .25s ease-out}
@keyframes settle{
  0%{transform:translateY(0) scale(1)}
  40%{transform:translateY(-9px) scale(1.015)}
  100%{transform:translateY(0) scale(1)}
}

.pass-message{
  position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  text-align:center;opacity:0;transform:scale(.7);pointer-events:none;
  transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.2,1)
}
.pass-message.visible{opacity:1;transform:scale(1)}
.pass-inner{
  padding:clamp(20px,5vw,55px) clamp(25px,7vw,75px);border-radius:28px;
  background:#000d;border:3px solid #ffffffb3;
  box-shadow:0 20px 70px #000b,0 0 50px var(--glow);backdrop-filter:blur(10px);
  font-size:clamp(2.2rem,10vw,6rem);line-height:.95;font-weight:1000;letter-spacing:-.045em
}
.bottom{display:flex;justify-content:center;align-items:center;padding:2px 0;z-index:30}
#mainButton{
  width:min(100%,570px);min-height:clamp(56px,9vh,80px);border:0;border-radius:17px;
  background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accentText);
  font-size:clamp(1.25rem,5vw,2rem);font-weight:950;cursor:pointer;touch-action:manipulation;
  box-shadow:0 10px 26px #0006,0 7px 20px #ffb52e33
}
#mainButton:active{transform:scale(.975) translateY(2px)}

.app.controls-hidden{grid-template-rows:0 1fr auto}
.controls-hidden header{
  transform:translateY(calc(-100% - 30px));opacity:0;max-height:0;pointer-events:none;
}
.reveal-tab{
  position:fixed;top:-2px;left:50%;transform:translateX(-50%) translateY(-115%);
  z-index:100;border:0;border-radius:0 0 12px 12px;padding:10px 22px 12px;min-width:150px;
  background:#000b;color:#fff;font-size:.7rem;font-weight:900;letter-spacing:.03em;
  opacity:0;pointer-events:none;transition:transform .35s ease,opacity .25s ease;
  backdrop-filter:blur(8px);
}
.controls-hidden .reveal-tab{
  transform:translateX(-50%) translateY(0);opacity:.7;pointer-events:auto;
}
.controls-hidden .reveal-tab:active{transform:translateX(-50%) translateY(2px)}
.auto-mode #mainButton{background:linear-gradient(180deg,#ff7878,#e53b3b);color:#fff}

@media(max-width:700px) and (orientation:portrait){
  .dice{column-gap:8px;row-gap:12px}
  .dice.count-1 .die-wrap{--size:min(72vw,58vh,430px)}
  .dice.count-2 .die-wrap{--size:min(41vw,31vh,235px)}
  .dice.count-3 .die-wrap{--size:min(30vw,27vh,210px)}
  .dice.count-4 .die-wrap,.dice.count-5 .die-wrap{--size:min(27vw,24vh,185px)}
  .dice.count-6 .die-wrap,.dice.count-7 .die-wrap{--size:min(25vw,21vh,165px)}
  .dice.count-8 .die-wrap,.dice.count-9 .die-wrap,.dice.count-10 .die-wrap{--size:min(23vw,19vh,145px)}
}
@media(orientation:landscape) and (max-height:520px){
  .app{padding-top:3px;gap:3px}
  h1{font-size:1.1rem}.small-button{padding:4px 7px;font-size:.68rem}
  #mainButton{min-height:44px;font-size:1.05rem}
  .dice.count-1 .die-wrap{--size:min(38vh,34vw,255px)}
  .dice.count-2 .die-wrap{--size:min(32vw,34vh,230px)}
}
</style>
</head>
<body>
<main class="app" id="app">
<button class="reveal-tab" id="revealTab" aria-label="Show controls">⌄ SHOW CONTROLS</button>
<header id="controls">
  <h1>🎲 Dice Roller</h1>
  <div class="top-controls">
    <button class="small-button" id="addDie">＋ Add Die</button>
    <button class="small-button" id="removeDie">− Remove Die</button>
    <button class="small-button" id="skinButton">🎨 Random Skin</button>
    <button class="small-button" id="voiceButton" aria-pressed="false">🔇 Voice Off</button>
  </div>
  <div class="dice-controls" id="diceControls"></div>
  <div class="auto-controls">
    <span class="auto-label">AUTO</span>
    <select id="intervalSelect">
      <option value="2">2 sec</option>
      <option value="3">3 sec</option>
      <option value="4" selected>4 sec</option>
      <option value="5">5 sec</option>
      <option value="10">10 sec</option>
    </select>
    <button class="small-button" id="autoButton">▶ Auto Roll</button>
  </div>
</header>

<section class="stage" id="stage">
  <div class="dice" id="dice"></div>
  <div class="pass-message" id="passMessage"><div class="pass-inner">PASS THE BALL</div></div>
</section>

<div class="bottom"><button id="mainButton">ROLL 🎲</button></div>
</main>

<script>
const app=document.getElementById("app");
const dice=document.getElementById("dice");
const diceControls=document.getElementById("diceControls");
const mainButton=document.getElementById("mainButton");
const addDie=document.getElementById("addDie");
const removeDie=document.getElementById("removeDie");
const skinButton=document.getElementById("skinButton");
const voiceButton=document.getElementById("voiceButton");
const autoButton=document.getElementById("autoButton");
const intervalSelect=document.getElementById("intervalSelect");
const passMessage=document.getElementById("passMessage");
const revealTab=document.getElementById("revealTab");

const SIDE_OPTIONS=[2,4,6,8,10,12,20,100];
const PIPS={
  1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],
  5:[0,2,4,6,8],6:[0,2,3,5,6,8]
};

/* Original D6 orientation map is preserved. */
const D6_ORIENT={
  1:"rotateX(0deg) rotateY(0deg) rotateZ(0deg)",
  2:"rotateX(0deg) rotateY(90deg) rotateZ(0deg)",
  3:"rotateX(-90deg) rotateY(0deg) rotateZ(0deg)",
  4:"rotateX(90deg) rotateY(0deg) rotateZ(0deg)",
  5:"rotateX(0deg) rotateY(-90deg) rotateZ(0deg)",
  6:"rotateX(0deg) rotateY(180deg) rotateZ(0deg)"
};

let settings=[6,6];
let values=[1,1];
let auto=false,paused=false,rolling=false,voiceEnabled=false;
let timer=null,passTimer=null,audioCtx=null;
let fullscreenAttempted=false;

const rnd=n=>Math.floor(Math.random()*n)+1;

function renderControls(){
  diceControls.innerHTML="";
  settings.forEach((s,i)=>{
    const box=document.createElement("div");
    box.className="die-control";
    const label=document.createElement("span");
    label.textContent=`D${i+1}`;
    const select=document.createElement("select");

    SIDE_OPTIONS.forEach(v=>{
      const option=document.createElement("option");
      option.value=v;
      option.textContent=`D${v}`;
      option.selected=v===s;
      select.appendChild(option);
    });

    select.onchange=()=>{
      settings[i]=Number(select.value);
      values[i]=Math.min(values[i]||1,settings[i])||1;
      renderDice();
    };

    box.append(label,select);
    diceControls.appendChild(box);
  });
}

function pipFace(value){
  const face=document.createElement("div");
  face.className="face";
  const grid=document.createElement("div");
  grid.className="pips";
  for(let i=0;i<9;i++){
    const pip=document.createElement("span");
    pip.className="pip";
    pip.style.visibility=PIPS[value]?.includes(i)?"visible":"hidden";
    grid.appendChild(pip);
  }
  face.appendChild(grid);
  return face;
}

function makeD6(value){
  const wrap=document.createElement("div");
  wrap.className="die-wrap";

  const cube=document.createElement("div");
  cube.className="die-cube";

  const faceValues={
    front:value,
    back:7-value,
    right:({1:3,2:4,3:1,4:2,5:6,6:5})[value],
    left:7-(({1:3,2:4,3:1,4:2,5:6,6:5})[value]),
    top:({1:5,2:6,3:5,4:6,5:1,6:2})[value],
    bottom:7-(({1:5,2:6,3:5,4:6,5:1,6:2})[value])
  };

  const faces={
    front:pipFace(faceValues.front),
    back:pipFace(faceValues.back),
    right:pipFace(faceValues.right),
    left:pipFace(faceValues.left),
    top:pipFace(faceValues.top),
    bottom:pipFace(faceValues.bottom)
  };

  faces.front.classList.add("front");
  faces.back.classList.add("back");
  faces.right.classList.add("right");
  faces.left.classList.add("left");
  faces.top.classList.add("top");
  faces.bottom.classList.add("bottom");

  Object.values(faces).forEach(f=>cube.appendChild(f));
  cube.dataset.final=String(value);
  cube.dataset.finalTransform=D6_ORIENT[value];

  wrap.appendChild(cube);
  return wrap;
}

function polygonPoints(n){
  const r=47;
  const pts=[];
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(2*Math.PI*i/n);
    pts.push(`${(50+r*Math.cos(a)).toFixed(2)},${(50+r*Math.sin(a)).toFixed(2)}`);
  }
  return pts.join(" ");
}

function makeNumberedSVG(sides,value){
  const wrap=document.createElement("div");
  wrap.className="die-wrap generic-wrap";

  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","generic-svg");
  svg.setAttribute("viewBox","0 0 100 100");
  svg.setAttribute("aria-label",`D${sides}, result ${value}`);

  const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
  const grad=document.createElementNS("http://www.w3.org/2000/svg","linearGradient");
  const gid=`g${Math.random().toString(36).slice(2)}`;
  grad.id=gid;
  grad.setAttribute("x1","0");grad.setAttribute("y1","0");
  grad.setAttribute("x2","1");grad.setAttribute("y2","1");
  const stop1=document.createElementNS("http://www.w3.org/2000/svg","stop");
  stop1.setAttribute("offset","0%");stop1.setAttribute("stop-color","var(--die2)");
  const stop2=document.createElementNS("http://www.w3.org/2000/svg","stop");
  stop2.setAttribute("offset","100%");stop2.setAttribute("stop-color","var(--die)");
  grad.append(stop1,stop2);defs.appendChild(grad);svg.appendChild(defs);

  /* D100 gets a many-sided circular silhouette; the roll/result is still random 1-100. */
  const visualSides=sides===100?40:sides;
  const poly=document.createElementNS("http://www.w3.org/2000/svg","polygon");
  poly.setAttribute("class","generic-shape");
  poly.setAttribute("points",polygonPoints(visualSides));
  poly.setAttribute("fill",`url(#${gid})`);
  svg.appendChild(poly);

  const text=document.createElementNS("http://www.w3.org/2000/svg","text");
  text.setAttribute("class","generic-result");
  text.setAttribute("x","50");text.setAttribute("y","52");
  text.textContent=value;
  svg.appendChild(text);

  const label=document.createElementNS("http://www.w3.org/2000/svg","text");
  label.setAttribute("class","generic-label");
  label.setAttribute("x","93");label.setAttribute("y","91");
  label.textContent=`D${sides}`;
  svg.appendChild(label);

  wrap.appendChild(svg);
  wrap.dataset.sides=sides;
  return wrap;
}

function makeCoin(value){
  const wrap=document.createElement("div");
  wrap.className="die-wrap coin-wrap";
  const coin=document.createElement("div");
  coin.className="coin";

  const front=document.createElement("div");
  front.className="coin-face front";
  front.textContent="1";

  const back=document.createElement("div");
  back.className="coin-face back";
  back.textContent="2";

  coin.append(front,back);
  coin.dataset.final=value;
  wrap.appendChild(coin);
  return wrap;
}

function makeGeneric(sides,value){
  if(sides===2)return makeCoin(value);
  return makeNumberedSVG(sides,value);
}

function renderDice(){
  dice.innerHTML="";
  dice.className=`dice count-${settings.length}`;
  settings.forEach((s,i)=>{
    const value=Math.min(values[i]||1,s);
    values[i]=value;
    dice.appendChild(s===6?makeD6(value):makeGeneric(s,value));
  });
}

function setFinalValue(wrap,sides,value){
  if(sides===6){
    const replacement=makeD6(value);
    replacement.style.cssText=wrap.style.cssText;
    wrap.replaceWith(replacement);
    return;
  }

  if(sides===2){
    const coin=wrap.querySelector(".coin");
    if(coin){
      coin.classList.remove("rolling");
      coin.classList.add("settle");
      coin.style.transform=value===1?"rotateY(0deg)":"rotateY(180deg)";
      coin.dataset.final=value;
      setTimeout(()=>coin.classList.remove("settle"),280);
    }
    return;
  }

  const n=wrap.querySelector(".generic-result");
  if(n)n.textContent=value;
}

function getAudio(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  return audioCtx;
}

function clack(){
  try{
    const c=getAudio();
    const o=c.createOscillator(),g=c.createGain();
    o.type="square";
    o.frequency.setValueAtTime(125,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(58,c.currentTime+.055);
    g.gain.setValueAtTime(.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.10,c.currentTime+.006);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.075);
    o.connect(g).connect(c.destination);
    o.start();o.stop(c.currentTime+.08);
  }catch(e){}
}

function rollNoise(){
  try{
    const c=getAudio();
    const b=c.createBuffer(1,c.sampleRate*.22,c.sampleRate);
    const data=b.getChannelData(0);
    for(let i=0;i<data.length;i++)
      data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2.6);

    const src=c.createBufferSource();
    const filter=c.createBiquadFilter();
    const gain=c.createGain();
    filter.type="bandpass";filter.frequency.value=1350;filter.Q.value=.7;
    gain.gain.value=.10;
    src.buffer=b;src.connect(filter).connect(gain).connect(c.destination);src.start();
  }catch(e){}
}

/*
  Fullscreen is requested at most once per page session.
  The old version entered fullscreen on every roll and then exited it again
  when controls returned, which is what caused Android Chrome to repeatedly
  show the "bisket74-eng.github.io — To exit full screen..." toast.
*/
async function enterImmersiveOnce(){
  if(fullscreenAttempted || document.fullscreenElement)return;
  fullscreenAttempted=true;
  try{
    const target=document.documentElement;
    if(target.requestFullscreen){
      await target.requestFullscreen({navigationUI:"hide"});
    }else if(target.webkitRequestFullscreen){
      target.webkitRequestFullscreen();
    }
  }catch(e){}
}

function hideControls(){
  app.classList.add("controls-hidden");
  enterImmersiveOnce();
}

function showControls(force=false){
  if(auto&&!force)return;
  app.classList.remove("controls-hidden");
  /* Do NOT exit fullscreen here. This prevents the browser from cycling
     fullscreen on/off after every roll. The user can leave fullscreen normally. */
}

function startRollAnimation(){
  const wraps=[...dice.children];

  wraps.forEach((wrap,i)=>{
    wrap.classList.remove("roll","settle","rolling");
    wrap.style.animation="none";
    wrap.style.transform="";
    const cube=wrap.querySelector(".die-cube");
    const coin=wrap.querySelector(".coin");
    if(cube){
      cube.classList.remove("cube-rolling");
      cube.style.animation="none";
      cube.style.transform="";
    }
    if(coin){
      coin.classList.remove("rolling","settle");
      coin.style.animation="none";
      coin.style.transform="";
    }

    const fromX=i%2===0?"-82vw":"82vw";
    const fromY=(Math.random()>.5?1:-1)*(8+Math.random()*22)+"vh";
    wrap.style.setProperty("--fromX",fromX);
    wrap.style.setProperty("--fromY",fromY);

    void wrap.offsetWidth;

    if(settings[i]===6){
      wrap.style.animation="";
      if(cube)cube.style.animation="";
      wrap.classList.add("roll");
      if(cube)cube.classList.add("cube-rolling");
    }else if(settings[i]===2){
      if(coin){
        coin.style.animation="";
        coin.classList.add("rolling");
      }
    }else{
      wrap.style.animation="";
      wrap.classList.add("rolling");
    }
  });

  rollNoise();
  [320,690,1040,1400].forEach(t=>setTimeout(clack,t));
}

function finishRoll(result){
  const oldWraps=[...dice.children];

  oldWraps.forEach((wrap,i)=>{
    const sides=settings[i];
    const cube=wrap.querySelector(".die-cube");
    const coin=wrap.querySelector(".coin");

    if(sides===6){
      if(cube){
        cube.style.animation="none";
        cube.classList.remove("cube-rolling");
        cube.style.transform=D6_ORIENT[result[i]];
      }
      wrap.classList.remove("roll");
      wrap.classList.add("settle");
      values[i]=result[i];
      setTimeout(()=>wrap.classList.remove("settle"),280);
    }else if(sides===2){
      if(coin){
        coin.style.animation="none";
        coin.classList.remove("rolling");
        coin.style.transform=result[i]===1?"rotateY(0deg)":"rotateY(180deg)";
        coin.classList.add("settle");
        values[i]=result[i];
        setTimeout(()=>coin.classList.remove("settle"),280);
      }
    }else{
      wrap.classList.remove("rolling");
      const n=wrap.querySelector(".generic-result");
      if(n)n.textContent=result[i];
      values[i]=result[i];
      wrap.classList.add("settle");
      setTimeout(()=>wrap.classList.remove("settle"),280);
    }
  });

  clack();
}

async function roll(){
  if(rolling||paused||passMessage.classList.contains("visible"))return;

  rolling=true;
  hideControls();

  const result=settings.map(sides=>{
    const r=rnd(sides);
    return Math.max(1,Math.min(sides,Math.trunc(r)));
  });
  const frozenResult=result.slice();

  startRollAnimation();
  await new Promise(resolve=>setTimeout(resolve,1720));
  finishRoll(frozenResult);
  rolling=false;

  const isDoubles=
    auto&&settings.length===2&&
    Number.isInteger(result[0])&&Number.isInteger(result[1])&&
    result[0]===result[1];

  if(isDoubles){
    showPass();
  }else if(auto){
    schedule();
  }else{
    setTimeout(()=>showControls(),520);
  }
}

function sayPassTheBall(){
  if(!voiceEnabled||!("speechSynthesis" in window))return;
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance("Pass the ball");
  utterance.rate=.9;utterance.pitch=1;utterance.volume=1;
  window.speechSynthesis.speak(utterance);
}

function showPass(){
  clearTimeout(timer);clearTimeout(passTimer);
  passMessage.classList.add("visible");
  sayPassTheBall();

  const passDuration=Number(intervalSelect.value)*1000+1000;
  passTimer=setTimeout(()=>{
    passMessage.classList.remove("visible");
    if(auto&&!paused)roll();
  },passDuration);
}

function schedule(){
  clearTimeout(timer);
  if(auto&&!paused&&!rolling&&!passMessage.classList.contains("visible")){
    timer=setTimeout(()=>{
      if(auto&&!paused)roll();
    },Number(intervalSelect.value)*1000);
  }
}

function startAuto(){
  auto=true;paused=false;
  app.classList.add("auto-mode");
  autoButton.textContent="⏹ Stop Auto";
  autoButton.classList.add("active");
  mainButton.textContent="⏸ PAUSE";
  hideControls();
  roll();
}

function stopAuto(){
  auto=false;paused=false;
  clearTimeout(timer);clearTimeout(passTimer);
  passMessage.classList.remove("visible");
  app.classList.remove("auto-mode");
  autoButton.textContent="▶ Auto Roll";
  autoButton.classList.remove("active");
  mainButton.textContent="ROLL 🎲";
  app.classList.remove("controls-hidden");
}

function togglePause(){
  if(!auto||rolling)return;
  if(paused){
    paused=false;
    mainButton.textContent="⏸ PAUSE";
    hideControls();
    roll();
  }else{
    paused=true;
    clearTimeout(timer);clearTimeout(passTimer);
    passMessage.classList.remove("visible");
    mainButton.textContent="▶ ROLL AGAIN";
    showControls(true);
  }
}

mainButton.onclick=()=>auto?togglePause():roll();
autoButton.onclick=()=>auto?stopAuto():startAuto();

revealTab.onclick=()=>{
  showControls(true);
  if(paused)mainButton.textContent="▶ ROLL AGAIN";
};

intervalSelect.onchange=()=>{
  if(auto&&!paused&&!rolling&&!passMessage.classList.contains("visible"))schedule();
};

addDie.onclick=()=>{
  if(settings.length>=10)return;
  settings.push(6);values.push(1);
  renderControls();renderDice();
};

removeDie.onclick=()=>{
  if(settings.length<=1)return;
  settings.pop();values.pop();
  renderControls();renderDice();
};

function randomSkin(){
  const hue=Math.random()*360;
  const dark=Math.random()<.72;
  const light=dark?8+Math.random()*18:70+Math.random()*20;

  const die=`hsl(${hue},${dark?55:65}%,${light}%)`;
  const die2=`hsl(${(hue+24)%360},${dark?60:70}%,${Math.min(97,light+10)}%)`;
  const pip=dark
    ?`hsl(${(hue+155)%360},90%,94%)`
    :`hsl(${(hue+165)%360},60%,9%)`;
  const edge=`hsl(${(hue+35)%360},85%,${dark?65:35}%)`;
  const accent=`hsl(${(hue+38)%360},85%,${dark?52:58}%)`;
  const accent2=`hsl(${(hue+38)%360},90%,${dark?68:78}%)`;

  document.documentElement.style.setProperty("--die",die);
  document.documentElement.style.setProperty("--die2",die2);
  document.documentElement.style.setProperty("--pip",pip);
  document.documentElement.style.setProperty("--edge",edge);
  document.documentElement.style.setProperty("--accent",accent);
  document.documentElement.style.setProperty("--accent2",accent2);
  document.documentElement.style.setProperty("--bg2",`hsl(${hue},30%,${dark?14:24}%)`);
  document.documentElement.style.setProperty("--bg",`hsl(${hue},32%,${dark?4:9}%)`);
  document.documentElement.style.setProperty("--glow",`hsla(${hue},90%,65%,${.10+Math.random()*.25})`);
}

voiceButton.onclick=()=>{
  voiceEnabled=!voiceEnabled;
  voiceButton.setAttribute("aria-pressed",String(voiceEnabled));
  voiceButton.textContent=voiceEnabled?"🔊 Voice On":"🔇 Voice Off";
  if(!voiceEnabled&&"speechSynthesis" in window)window.speechSynthesis.cancel();
};

document.addEventListener("fullscreenchange",()=>{});
skinButton.onclick=randomSkin;

let touchStartY=null;
document.addEventListener("touchstart",e=>{
  if(e.touches.length===1)touchStartY=e.touches[0].clientY;
},{passive:true});

document.addEventListener("touchend",e=>{
  if(touchStartY===null)return;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(app.classList.contains("controls-hidden")&&dy>55)showControls(true);
  touchStartY=null;
},{passive:true});

randomSkin();
renderControls();
renderDice();
</script>
</body>
</html>
